*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--text);font-family:var(--font-ui);
  font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-dis);font-weight:600;line-height:1.25}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:var(--font-mono);font-size:.88em;background:var(--card-2);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 4px;overflow-wrap:anywhere}

.top{position:sticky;top:38px;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;height:54px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--font-dis);font-weight:600;
  font-size:15px;white-space:nowrap}
.brand span{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:1px 5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--text-2);font-family:inherit}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.cerca{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font-size:13px;color:var(--text);width:200px;font-family:inherit}

.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;
  display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.rail{position:sticky;top:108px;max-height:calc(100vh - 130px);overflow-y:auto}
.dom-h{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);
  font-weight:600;margin:14px 0 5px}
.dom-h:first-child{margin-top:0}
.nav-l{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:5px 8px;border-radius:6px;font-size:13px;color:var(--text-2);line-height:1.35;
  font-family:inherit}
.nav-l:hover{background:var(--card);color:var(--text)}
.nav-l.fatto::before{content:"✓ ";color:var(--good);font-weight:700}

.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.intro h1{font-size:21px;margin-bottom:7px}
.intro p{margin:0;color:var(--text-2);font-size:14px;max-width:70ch}
.intro p+p{margin-top:9px}

.avviso{margin-top:13px;padding:11px 13px;background:var(--signal-soft);
  border-left:3px solid var(--signal);border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text-2)}
.avviso strong{color:var(--text)}

.lab{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:104px}
.lab.puntato{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.lab-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--line-2);background:var(--card-2)}
.lab-h h2{font-size:16.5px;flex:1;min-width:0}
.num{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--accent-2)}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap}
.chip.t{background:var(--accent-soft);color:var(--accent-2)}
.chip.c-gratis{background:var(--good-soft);color:var(--good)}
.chip.c-centesimi{background:var(--signal-soft);color:var(--signal)}
.chip.c-ore{background:var(--bad-soft);color:var(--bad)}

.lab-b{padding:16px 20px 4px}
.sez{margin-bottom:14px}
.sez h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-3);
  margin-bottom:5px}
.sez p{color:var(--text-2);font-size:14.5px}
.sez ol,.sez ul{margin:0;padding-left:20px;color:var(--text-2);font-size:14.5px}
.sez li{margin-bottom:4px}
.sez.pulizia{background:var(--bad-soft);border-radius:8px;padding:11px 13px}
.sez.pulizia h3{color:var(--bad)}
pre{background:var(--card-2);border:1px solid var(--line-2);border-radius:8px;padding:11px 13px;
  overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.6;color:var(--text)}
pre code{background:none;border:0;padding:0;font-size:inherit}

.lab-f{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 20px;
  border-top:1px solid var(--line-2);background:var(--card-2);font-size:13px}
.lab-f a{white-space:nowrap}
.segna{margin-left:auto}
.segna.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}

.vuoto{color:var(--text-3);font-size:14px}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr;gap:14px}
  .rail{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:12px}
  .cerca{width:130px}
}

"use strict";
const LAB = [{"id":"P01","d":1,"t":"Utenti, gruppi e reset della password","min":35,"costo":"gratis","obiettivi":["Create users and groups","Manage user and group properties","Configure self-service password reset (SSPR)"],"perche":"È il primo dominio per peso, e l'esame ci gira intorno con domande su **dove** si configura una cosa: la usage location sta sulla scheda dell'utente, l'SSPR sta a livello di tenant, i gruppi dinamici vogliono una licenza. Sono dettagli che si ricordano solo dopo averli cercati una volta.","serve":"Un tenant Microsoft Entra ID. Quello che arriva con l'account gratuito basta: non serve licenza per creare utenti e gruppi Assigned.","passi":["Crea due utenti e un gruppo di sicurezza, poi mettici dentro uno dei due.","Sulla scheda di un utente compila **Usage location** e **Department**: la prima serve per assegnare licenze, la seconda per le regole dei gruppi dinamici.","Nel portale, `Microsoft Entra ID` → `Password reset` → `Properties`: abilita l'SSPR per un gruppo (non per tutti), poi in `Authentication methods` porta **Number of methods required to reset** a 2.","In `Registration` guarda l'opzione **Require users to register when signing in**: è quella che l'esame confonde con l'abilitazione dell'SSPR.","Prova a creare un gruppo **Dynamic User** con la regola `user.department -eq \"Sales\"`. Se il portale te lo blocca, è la licenza P1 che manca — ed è esattamente la risposta che l'esame vuole."],"cli":"# utenti\naz ad user create --display-name \"Mario Rossi\" \\\n  --user-principal-name mario.rossi@TUOTENANT.onmicrosoft.com \\\n  --password 'Lab!Password123' --force-change-password-next-sign-in true\n\naz ad user create --display-name \"Lucia Bianchi\" \\\n  --user-principal-name lucia.bianchi@TUOTENANT.onmicrosoft.com \\\n  --password 'Lab!Password123' --force-change-password-next-sign-in true\n\n# gruppo di sicurezza e un membro\naz ad group create --display-name \"Sales\" --mail-nickname sales\n\nID=$(az ad user show --id mario.rossi@TUOTENANT.onmicrosoft.com --query id -o tsv)\naz ad group member add --group Sales --member-id $ID\n\n# controlla\naz ad group member list --group Sales --query \"[].displayName\" -o tsv","verifica":"`az ad group member list --group Sales` mostra Mario e non Lucia. Nel portale, l'utente su cui hai lasciato vuota la Usage location non ti fa assegnare licenze: il messaggio d'errore è quello che l'esame descrive a parole.","pulizia":"Niente da pagare, ma pulisci per non lasciare account attivi nel tenant:\n\n`az ad group delete --group Sales`\n`az ad user delete --id mario.rossi@TUOTENANT.onmicrosoft.com`\n`az ad user delete --id lucia.bianchi@TUOTENANT.onmicrosoft.com`","lab":{"t":"Lab 01 ufficiale: Manage Microsoft Entra ID Identities","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_01-Manage_Entra_ID_Identities.html"}},{"id":"P02","d":1,"t":"Invitare un utente esterno","min":15,"costo":"gratis","obiettivi":["Manage external users"],"perche":"L'esame chiede la differenza fra **Member** e **Guest** e cosa un guest può vedere per impostazione predefinita. Farne uno e guardargli la scheda chiude la questione in dieci minuti.","serve":"Un secondo indirizzo email a cui puoi accedere, anche personale.","passi":["Invita l'indirizzo esterno come guest e accetta l'invito dall'altra casella.","Guarda la scheda del guest: **User type** è `Guest`, l'UPN è nella forma `nome_dominio.com#EXT#@tuotenant.onmicrosoft.com`. Quella forma è materiale d'esame.","In `Microsoft Entra ID` → `External Identities` → `External collaboration settings` guarda chi può invitare: è la manopola che l'esame usa negli scenari «un utente non riesce a invitare»."],"cli":"az rest --method post \\\n  --url https://graph.microsoft.com/v1.0/invitations \\\n  --body '{\n    \"invitedUserEmailAddress\": \"tua.altra.email@example.com\",\n    \"inviteRedirectUrl\": \"https://portal.azure.com\",\n    \"sendInvitationMessage\": true\n  }'","verifica":"`az ad user list --filter \"userType eq 'Guest'\" --query \"[].userPrincipalName\" -o tsv` elenca il guest con il suo UPN `#EXT#`.","pulizia":"`az ad user delete --id \"tua.altra.email_example.com#EXT#@TUOTENANT.onmicrosoft.com\"`","lab":{"t":"Lab 01 ufficiale: Manage Microsoft Entra ID Identities","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_01-Manage_Entra_ID_Identities.html"}},{"id":"P03","d":1,"t":"Ruoli RBAC, ambiti e chi può cosa","min":30,"costo":"gratis","obiettivi":["Manage built-in Azure roles","Assign roles at different scopes","Interpret access assignments"],"perche":"Metà delle domande di questo dominio sono «questa persona può fare X?», e si risolvono sapendo due cose: le assegnazioni si **ereditano** verso il basso, e per **assegnare ruoli ad altri** non basta Contributor — serve Owner o User Access Administrator. Vederlo una volta vale più di rileggerlo tre.","serve":"Una sottoscrizione e i due utenti del lab P01.","passi":["Crea due resource group, `rg-lab-a` e `rg-lab-b`.","Dai a Mario il ruolo **Reader** sulla sottoscrizione e **Contributor** solo su `rg-lab-a`.","Elenca le assegnazioni con `--all` e guarda la colonna dello scope: su `rg-lab-a` ne vede due, e vince la più permissiva. Su `rg-lab-b` ne vede una sola, ereditata.","Prova ad assegnare un ruolo **come Mario**: Contributor non può. È la trappola più frequente del dominio.","Guarda cosa contiene davvero un ruolo integrato con `az role definition list`: le sezioni `actions` e `notActions`."],"cli":"az group create -n rg-lab-a -l westeurope\naz group create -n rg-lab-b -l westeurope\n\nUTENTE=mario.rossi@TUOTENANT.onmicrosoft.com\nSUB=$(az account show --query id -o tsv)\n\naz role assignment create --assignee $UTENTE --role \"Reader\" \\\n  --scope /subscriptions/$SUB\n\naz role assignment create --assignee $UTENTE --role \"Contributor\" \\\n  --resource-group rg-lab-a\n\n# tutte le assegnazioni che lo riguardano, ereditate comprese\naz role assignment list --assignee $UTENTE --all -o table\n\n# cosa contiene un ruolo integrato\naz role definition list --name \"Virtual Machine Contributor\" \\\n  --query \"[0].permissions[0].{consentiti:actions, negati:notActions}\"","verifica":"L'elenco con `--all` mostra due righe per Mario: una con scope `/subscriptions/...` e una con scope `.../resourceGroups/rg-lab-a`. Questo è l'ereditarietà, ed è la cosa che l'esame chiede di leggere in una schermata.","pulizia":"`az role assignment delete --assignee $UTENTE --scope /subscriptions/$SUB`\n`az group delete -n rg-lab-a --yes --no-wait`\n`az group delete -n rg-lab-b --yes --no-wait`","lab":{"t":"Lab 02a ufficiale: Manage Subscriptions and RBAC","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_02a_Manage_Subscriptions_and_RBAC_Entra.html"}},{"id":"P04","d":1,"t":"Tag, blocchi e spostare risorse","min":30,"costo":"centesimi","obiettivi":["Apply and manage tags on resources","Configure resource locks","Manage resource groups"],"perche":"Tre trappole classiche in un lab solo: i tag **non si ereditano** da soli dal resource group, `ReadOnly` blocca molto più di quanto sembri, e spostare una risorsa non ne cambia la region.","serve":"Una sottoscrizione. La risorsa di prova è un account di archiviazione vuoto: costa frazioni di centesimo.","passi":["Crea `rg-lab-tag` con due tag e dentro un account di archiviazione **senza** tag.","Guarda i tag della risorsa: sono vuoti. I tag del resource group non scendono da soli — ci vuole Azure Policy, ed è il lab P05.","Metti un lock **CanNotDelete** sul resource group e prova a cancellare l'account: fallisce.","Cambia il lock in **ReadOnly** e prova a modificare l'account, per esempio il tier: fallisce anche quello. `ReadOnly` blocca anche operazioni che sembrano letture, come rigenerare le chiavi.","Togli il lock e sposta l'account in `rg-lab-tag-2`: cambia il resource group, la region resta quella di prima."],"cli":"az group create -n rg-lab-tag -l westeurope --tags ambiente=lab costCenter=1234\naz group create -n rg-lab-tag-2 -l westeurope\n\nSA=stlab$RANDOM\naz storage account create -n $SA -g rg-lab-tag -l westeurope --sku Standard_LRS\n\n# i tag del gruppo non sono scesi sulla risorsa\naz storage account show -n $SA -g rg-lab-tag --query tags\n\n# blocco: prima non cancellabile, poi sola lettura\naz lock create --name no-delete --lock-type CanNotDelete -g rg-lab-tag\naz storage account delete -n $SA -g rg-lab-tag --yes   # fallisce, ed e' giusto\n\naz lock delete --name no-delete -g rg-lab-tag\n\n# sposta: cambia il gruppo, non la region\nID=$(az storage account show -n $SA -g rg-lab-tag --query id -o tsv)\naz resource move --destination-group rg-lab-tag-2 --ids $ID\naz storage account show -n $SA -g rg-lab-tag-2 --query location -o tsv","verifica":"Il comando di delete con il lock attivo esce con un errore che nomina il lock. Dopo lo spostamento, `location` è ancora `westeurope`: se un giorno l'esame ti chiede come si sposta una risorsa in un'altra region, la risposta non è `az resource move`.","pulizia":"`az group delete -n rg-lab-tag --yes --no-wait`\n`az group delete -n rg-lab-tag-2 --yes --no-wait`\n\nSe un delete fallisce, hai lasciato un lock: `az lock list -g <gruppo> -o table` e cancellalo prima.","lab":{"t":"Lab 02b ufficiale: Manage Governance via Azure Policy","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_02b-Manage_Governance_via_Azure_Policy.html"}},{"id":"P05","d":1,"t":"Azure Policy: assegnare, valutare, rimediare","min":40,"costo":"centesimi","obiettivi":["Implement and manage Azure Policy","Configure management groups"],"perche":"Questo lab è la risposta a una domanda che nella banca c'è davvero: come si fa a far ereditare un tag a **risorse già esistenti**. La catena è policy con effetto **Modify** → serve una **managed identity** con permessi di scrittura → le risorse vecchie si sistemano solo con una **remediation task**. Ogni anello è un distrattore d'esame.","serve":"Una sottoscrizione e i resource group del lab P04.","passi":["Trova la definizione integrata **Inherit a tag from the resource group** e leggi qual è il suo effetto.","Assegnala sul resource group, passando `CostCenter` come nome del tag, con identità gestita di sistema e ruolo Contributor: senza identità la policy non può scrivere.","Crea una risorsa nuova e verifica che il tag arrivi da solo.","Guarda una risorsa creata **prima** dell'assegnazione: il tag non c'è. La policy non torna indietro nel tempo.","Lancia una **remediation task** e ricontrolla.","Per i management group: creane uno, mettici dentro la sottoscrizione, e nota che una policy assegnata lì vale per tutte le sottoscrizioni sotto."],"cli":"RG=rg-lab-pol\naz group create -n $RG -l westeurope --tags CostCenter=1234\n\n# risorsa creata PRIMA della policy: restera' senza tag\naz storage account create -n stprima$RANDOM -g $RG -l westeurope --sku Standard_LRS\n\nDEF=$(az policy definition list \\\n  --query \"[?displayName=='Inherit a tag from the resource group'].name\" -o tsv)\n\naz policy assignment create --name eredita-costcenter \\\n  --scope $(az group show -n $RG --query id -o tsv) \\\n  --policy $DEF --params '{\"tagName\":{\"value\":\"CostCenter\"}}' \\\n  --mi-system-assigned --location westeurope --role Contributor\n\n# risorsa creata DOPO: il tag arriva da solo\naz storage account create -n stdopo$RANDOM -g $RG -l westeurope --sku Standard_LRS\n\n# le vecchie si sistemano solo cosi'\naz policy remediation create --name rimedia-costcenter \\\n  --policy-assignment eredita-costcenter --resource-group $RG","verifica":"L'account creato dopo l'assegnazione ha `CostCenter=1234` senza che tu l'abbia scritto. Quello creato prima ce l'ha solo dopo la remediation. Se la remediation fallisce con un errore di permessi, hai dimenticato `--mi-system-assigned --role Contributor`.","pulizia":"`az policy assignment delete --name eredita-costcenter --scope $(az group show -n rg-lab-pol --query id -o tsv)`\n`az group delete -n rg-lab-pol --yes --no-wait`\n\nSe hai creato il management group: `az account management-group delete --name mg-lab` (prima togli la sottoscrizione, altrimenti si rifiuta).","lab":{"t":"Lab 02b ufficiale: Manage Governance via Azure Policy","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_02b-Manage_Governance_via_Azure_Policy.html"}},{"id":"P06","d":1,"t":"Budget, avvisi di costo e Advisor","min":20,"costo":"gratis","obiettivi":["Manage costs by using alerts, budgets, and Azure Advisor recommendations","Manage subscriptions","Manage licenses in Microsoft Entra ID"],"perche":"L'esame chiede la differenza fra un **budget** (che avvisa e basta, non spegne niente) e un **cost alert**, e dove vivono. In più è la cosa che ti salva il credito nei mesi in cui fai i lab.","serve":"Una sottoscrizione. Si fa dal portale: Cost Management non ha una CLI comoda.","passi":["Portale → `Subscriptions` → la tua → `Cost Management` → `Budgets` → `Add`. Metti un budget mensile basso, per esempio 20 €.","Nella pagina delle condizioni imposta due soglie, 50% e 90%, con la tua email. Nota che il budget **non blocca niente**: quando lo superi, ti arriva una mail e le risorse continuano a girare. È esattamente la domanda d'esame.","Vai in `Advisor` e leggi le raccomandazioni di **Cost**: ti dice quali risorse stanno lì a non fare niente.","Guarda `Cost analysis` raggruppato per **Resource group**: è il modo in cui ti accorgi che il lab di ieri è ancora acceso.","Passa un momento da `Microsoft Entra ID` → `Licenses` per vedere dove si assegnano: senza usage location sull'utente, l'assegnazione fallisce."],"verifica":"Nella lista dei budget compare il tuo con la percentuale di consumo attuale. Se hai fatto i lab precedenti e pulito bene, è vicina a zero.","pulizia":"Il budget lascialo: costa zero ed è la tua rete di sicurezza per i prossimi mesi. Se proprio vuoi toglierlo, dalla stessa pagina `Budgets` → `Delete`.","lab":{"t":"Lab 02a ufficiale: Manage Subscriptions and RBAC","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_02a_Manage_Subscriptions_and_RBAC_Entra.html"}},{"id":"P07","d":2,"t":"Account di archiviazione, ridondanza e cifratura","min":30,"costo":"centesimi","obiettivi":["Create and configure storage accounts","Configure Azure Storage redundancy","Configure storage account encryption"],"perche":"L'esame ama le domande su **cosa si può cambiare dopo**. La ridondanza sì, in parte; il nome no; la **infrastructure encryption** no, mai — si sceglie alla creazione e basta. Provare a cambiarle è il modo più rapido per non dimenticarlo.","serve":"Una sottoscrizione. Un account vuoto costa frazioni di centesimo al mese.","passi":["Crea un account **Standard_LRS** e uno con **infrastructure encryption** attiva, per vedere che è un'opzione della creazione.","Cambia il primo da LRS a **GRS**: funziona. Prova a portarlo a **ZRS**: non è una modifica diretta, richiede una conversione. Le combinazioni possibili sono materiale d'esame.","Guarda `Encryption` nel portale: la cifratura a riposo è **sempre attiva** e non si spegne. Quello che si sceglie è la chiave: gestita da Microsoft o tua in Key Vault (CMK).","Prova ad attivare l'infrastructure encryption su un account esistente: l'opzione è grigia."],"cli":"RG=rg-lab-st\naz group create -n $RG -l westeurope\n\nSA=stlab$RANDOM\naz storage account create -n $SA -g $RG -l westeurope \\\n  --sku Standard_LRS --kind StorageV2 --access-tier Hot\n\n# doppia cifratura: solo alla creazione\naz storage account create -n stinfra$RANDOM -g $RG -l westeurope \\\n  --sku Standard_LRS --kind StorageV2 --require-infrastructure-encryption true\n\n# la ridondanza si cambia\naz storage account update -n $SA -g $RG --sku Standard_GRS\naz storage account show -n $SA -g $RG --query \"{sku:sku.name, cifratura:encryption.keySource}\"","verifica":"`sku` è passato a `Standard_GRS`. `encryption.keySource` dice `Microsoft.Storage`: è la chiave gestita da Microsoft, e conferma che la cifratura a riposo c'è anche se non l'hai chiesta.","pulizia":"`az group delete -n rg-lab-st --yes --no-wait` — tiene dentro tutti i lab di storage, quindi cancellalo alla fine di P13, non adesso.","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P08","d":2,"t":"Blob: container, tier, versioning e soft delete","min":35,"costo":"centesimi","obiettivi":["Create and configure a container in Azure Blob Storage","Configure storage tiers","Configure blob versioning","Configure soft delete for blobs and containers"],"perche":"Qui l'esame chiede due cose che si confondono: **versioning** conserva le versioni a ogni sovrascrittura, **soft delete** recupera quello che hai cancellato. Sono interruttori diversi, e vanno attivati *prima* del guaio. E il tier **Archive** non si legge: prima va riportato online, e ci vogliono ore.","serve":"L'account del lab P07.","passi":["Attiva versioning, soft delete dei blob e soft delete dei container sull'account.","Crea un container e caricaci un file. Sovrascrivilo con un contenuto diverso: nasce una versione.","Cancella il blob e ritrovalo con `--include d`: c'è ancora, marcato come cancellato.","Sposta un blob in **Cool**, poi in **Archive**. Prova a scaricarlo: fallisce. Per riaverlo serve una **rehydration** a Hot o Cool, che richiede ore — l'esame lo chiede in forma di «quanto ci vuole».","Guarda il livello di accesso del container: `Private`, `Blob`, `Container`. La differenza fra gli ultimi due (uno espone il singolo blob, l'altro anche l'elenco) è una domanda classica."],"cli":"SA=<il tuo account>\nRG=rg-lab-st\n\naz storage account blob-service-properties update --account-name $SA -g $RG \\\n  --enable-versioning true \\\n  --enable-delete-retention true --delete-retention-days 7 \\\n  --enable-container-delete-retention true --container-delete-retention-days 7\n\naz storage container create --account-name $SA -n dati --auth-mode login\n\necho \"versione uno\" > prova.txt\naz storage blob upload --account-name $SA -c dati -f prova.txt -n prova.txt --auth-mode login\necho \"versione due\" > prova.txt\naz storage blob upload --account-name $SA -c dati -f prova.txt -n prova.txt --overwrite --auth-mode login\n\n# le versioni\naz storage blob list --account-name $SA -c dati --include v \\\n  --query \"[].{nome:name, versione:versionId}\" -o table --auth-mode login\n\n# cancella e ritrova\naz storage blob delete --account-name $SA -c dati -n prova.txt --auth-mode login\naz storage blob list --account-name $SA -c dati --include d -o table --auth-mode login\n\n# tier\naz storage blob set-tier --account-name $SA -c dati -n prova.txt --tier Cool --auth-mode login","verifica":"L'elenco con `--include v` mostra due `versionId` per lo stesso nome. Dopo il delete, l'elenco normale è vuoto ma quello con `--include d` no: è il soft delete che ha funzionato.","pulizia":"Il container e i blob se ne vanno con il resource group alla fine di P13. Se vuoi liberare subito:\n\n`az storage container delete --account-name $SA -n dati --auth-mode login`\n\nCon il soft delete attivo il container resta recuperabile per 7 giorni: è il comportamento giusto, non un errore.","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P09","d":2,"t":"Lifecycle: far scendere i blob da soli","min":20,"costo":"centesimi","obiettivi":["Configure blob lifecycle management"],"perche":"La regola si scrive in JSON, e l'esame te ne mostra una chiedendo cosa fa. I punti su cui casca la gente: le regole valgono **solo per i blob a blocchi**, il conteggio dei giorni parte dall'**ultima modifica** (o dall'ultimo accesso, se lo attivi), e la valutazione gira **una volta al giorno** — non succede niente all'istante.","serve":"L'account e il container del lab P08.","passi":["Scrivi una regola: dopo 30 giorni senza modifiche → Cool, dopo 90 → Archive, dopo 365 → cancella.","Applicala all'account, limitandola al prefisso `dati/`.","Rileggila con `show` e confronta il JSON con quello che hai scritto: è la forma che l'esame ti mette davanti.","Nel portale, `Lifecycle management` → `List view`: la stessa regola vista come modulo. Sapere che sono la stessa cosa evita di rispondere «non si può fare dal portale»."],"cli":"cat > regola.json <<'FINE'\n{\n  \"rules\": [{\n    \"enabled\": true,\n    \"name\": \"scendi-e-cancella\",\n    \"type\": \"Lifecycle\",\n    \"definition\": {\n      \"filters\": {\n        \"blobTypes\": [\"blockBlob\"],\n        \"prefixMatch\": [\"dati/\"]\n      },\n      \"actions\": {\n        \"baseBlob\": {\n          \"tierToCool\":    { \"daysAfterModificationGreaterThan\": 30 },\n          \"tierToArchive\": { \"daysAfterModificationGreaterThan\": 90 },\n          \"delete\":        { \"daysAfterModificationGreaterThan\": 365 }\n        }\n      }\n    }\n  }]\n}\nFINE\n\naz storage account management-policy create \\\n  --account-name $SA -g $RG --policy @regola.json\n\naz storage account management-policy show --account-name $SA -g $RG","verifica":"`show` restituisce la regola con `enabled: true`. Non aspettarti di vedere blob cambiare tier oggi: la valutazione parte una volta al giorno, e la prima esecuzione può metterci fino a 24 ore.","pulizia":"`az storage account management-policy delete --account-name $SA -g $RG`\n\nE cancella il file locale: `rm regola.json`","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P10","d":2,"t":"SAS, criteri di accesso archiviati e chiavi","min":35,"costo":"gratis","obiettivi":["Create and use shared access signature (SAS) tokens","Configure stored access policies","Manage access keys"],"perche":"Questa è la domanda d'esame più prevedibile del dominio: **come si revoca un SAS già distribuito**. Un SAS ad hoc non si revoca — puoi solo rigenerare la chiave, e così ammazzi *tutti* i SAS. Se invece l'hai legato a un **criterio di accesso archiviato**, cancelli il criterio e muore solo quello. Farlo una volta ti risparmia di ragionarci sotto esame.","serve":"L'account e il container del lab P08.","passi":["Genera un SAS ad hoc di sola lettura sul container e provalo con `curl`.","Crea un **criterio di accesso archiviato** sul container e genera un secondo SAS che vi si appoggia.","Cancella il criterio: il secondo SAS smette di funzionare all'istante, il primo continua.","Rigenera la chiave primaria: adesso muore anche il primo, e con lui qualunque altro SAS firmato con quella chiave.","Nota la differenza fra SAS di **servizio**, di **account** e **user delegation** (firmato con Entra ID invece che con la chiave): l'ultimo è quello che il portale usa quando scegli «Microsoft Entra ID» come metodo."],"cli":"SA=<il tuo account>\nRG=rg-lab-st\nKEY=$(az storage account keys list -n $SA -g $RG --query \"[0].value\" -o tsv)\n\n# 1) SAS ad hoc\nSAS1=$(az storage container generate-sas --account-name $SA --account-key $KEY \\\n  -n dati --permissions rl --expiry 2026-12-31T00:00Z -o tsv)\ncurl -s \"https://$SA.blob.core.windows.net/dati?restype=container&comp=list&$SAS1\" | head -c 200\n\n# 2) criterio archiviato, e un SAS che ci si appoggia\naz storage container policy create --account-name $SA --account-key $KEY \\\n  -c dati -n solo-lettura --permissions rl --expiry 2026-12-31T00:00Z\n\nSAS2=$(az storage container generate-sas --account-name $SA --account-key $KEY \\\n  -n dati --policy-name solo-lettura -o tsv)\n\n# 3) revoca mirata\naz storage container policy delete --account-name $SA --account-key $KEY \\\n  -c dati -n solo-lettura\n\n# 4) revoca totale\naz storage account keys renew -n $SA -g $RG --key primary","verifica":"Dopo il passo 3 la richiesta con `$SAS2` risponde con un errore di autenticazione e quella con `$SAS1` no. Dopo il passo 4 falliscono tutte e due. È esattamente lo scenario che l'esame descrive a parole.","pulizia":"Niente da cancellare: chiavi e criteri vivono dentro l'account, che se ne va con il resource group alla fine di P13.","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P11","d":2,"t":"Firewall dello storage e accesso dalla rete","min":25,"costo":"gratis","obiettivi":["Configure Azure Storage firewalls and virtual networks"],"perche":"Il momento in cui chiudi il firewall e ti tagli fuori da solo è il momento in cui impari `--bypass` e le regole per indirizzo IP. L'esame lo chiede al contrario: «l'accesso non funziona più, cosa hai sbagliato».","serve":"L'account del lab P07 e il tuo indirizzo IP pubblico.","passi":["Metti `Default action` su **Deny** e prova a elencare i blob: adesso ti rifiuta.","Aggiungi il tuo IP pubblico come regola e riprova: torna a funzionare.","Guarda `--bypass`: `AzureServices` è quello che lascia entrare i servizi Microsoft, ed è la casella che l'esame fa togliere per creare il guasto.","Nota che il firewall **non blocca** chi entra con RBAC dal portale se hai spuntato «Add your client IP address»: l'esame gioca su questa differenza fra piano dati e piano di controllo."],"cli":"MIOIP=$(curl -s https://api.ipify.org)\necho \"il mio IP: $MIOIP\"\n\n# chiudi tutto\naz storage account update -n $SA -g $RG --default-action Deny --bypass AzureServices\naz storage blob list --account-name $SA -c dati --auth-mode login -o table   # ora fallisce\n\n# riapri solo a te\naz storage account network-rule add -n $SA -g $RG --ip-address $MIOIP\naz storage blob list --account-name $SA -c dati --auth-mode login -o table   # ora va\n\naz storage account show -n $SA -g $RG --query networkRuleSet","verifica":"`networkRuleSet` mostra `defaultAction: Deny`, il tuo IP fra le `ipRules` e `bypass: AzureServices`. Se dopo aver aggiunto l'IP continua a rifiutare, aspetta un minuto: la regola impiega qualche istante a propagarsi.","pulizia":"Riapri prima di andartene, altrimenti i lab successivi falliscono senza spiegazione:\n\n`az storage account update -n $SA -g $RG --default-action Allow`","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P12","d":2,"t":"Azure Files: condivisione, snapshot e soft delete","min":30,"costo":"centesimi","obiettivi":["Create and configure a file share in Azure Files","Configure snapshots and soft delete for Azure Files","Configure identity-based access for Azure Files"],"perche":"Azure Files ha interruttori **suoi**, separati da quelli dei blob: il soft delete dei file sta sotto `File service`, non sotto `Blob service`. L'esame ci costruisce sopra domande in cui hai attivato la cosa giusta nel posto sbagliato.","serve":"L'account del lab P07.","passi":["Crea una condivisione con quota e carica un file.","Attiva il **soft delete** delle condivisioni, dal servizio File.","Fai uno **snapshot** della condivisione, modifica il file, e nota che lo snapshot conserva la versione di prima.","Cancella la condivisione e ritrovala fra quelle cancellate: si ripristina.","Per l'accesso basato su identità apri nel portale `File shares` → `Active Directory`: ci sono tre strade — AD DS on-premise, Microsoft Entra Domain Services, Microsoft Entra Kerberos. Non serve configurarle qui: serve **sapere che sono tre** e che senza una di queste l'accesso passa solo dalla chiave dell'account."],"cli":"az storage share-rm create --storage-account $SA -g $RG \\\n  -n condivisione --quota 100 --access-tier TransactionOptimized\n\nKEY=$(az storage account keys list -n $SA -g $RG --query \"[0].value\" -o tsv)\necho \"contenuto originale\" > doc.txt\naz storage file upload --account-name $SA --account-key $KEY \\\n  -s condivisione --source doc.txt\n\n# soft delete: e' del servizio File, non del Blob\naz storage account file-service-properties update -n $SA -g $RG \\\n  --enable-delete-retention true --delete-retention-days 7\n\n# snapshot\naz storage share snapshot -n condivisione --account-name $SA --account-key $KEY\naz storage share list --account-name $SA --account-key $KEY --include-snapshots -o table","verifica":"L'elenco con `--include-snapshots` mostra la condivisione due volte: una senza data e una con lo snapshot. Dopo aver cancellato la condivisione, `az storage share-rm list --storage-account $SA -g $RG --include-deleted` la mostra ancora, con `deleted: true`.","pulizia":"`az storage share-rm delete --storage-account $SA -g $RG -n condivisione --yes`\n\nCon il soft delete attivo resta recuperabile 7 giorni e continua a occupare spazio: se vuoi liberarlo subito, riporta `--delete-retention-days` a 1 o disattiva la ritenzione prima di cancellare.","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P13","d":2,"t":"AzCopy, Storage Explorer e replica degli oggetti","min":30,"costo":"centesimi","obiettivi":["Manage data by using Azure Storage Explorer and AzCopy","Configure object replication"],"perche":"AzCopy è lo strumento che l'esame nomina quando la domanda dice «migliaia di file, minimo sforzo». La **object replication** invece ha tre prerequisiti che l'esame usa come distrattori: versioning e change feed sull'origine, versioning sulla destinazione, e vale **solo per i blob a blocchi**.","serve":"L'account del lab P07 più un secondo account come destinazione. AzCopy si scarica gratis; nella Cloud Shell c'è già.","passi":["Copia una cartella locale nel container con `azcopy copy --recursive`, autenticandoti con `azcopy login`.","Sincronizza con `azcopy sync` e nota la differenza: `copy` ricopia, `sync` allinea e può cancellare.","Apri Storage Explorer (o la sua versione nel portale) e ritrova gli stessi file: serve a sapere che esiste e che parla lo stesso storage.","Crea un secondo account, attiva versioning e change feed sull'origine e versioning sulla destinazione, poi crea la policy di replica.","Carica un blob nell'origine e aspetta: compare nella destinazione. La replica è **asincrona**, quindi «immediatamente» è sempre la risposta sbagliata."],"cli":"# --- AzCopy\nazcopy login\nazcopy copy \"./unacartella\" \"https://$SA.blob.core.windows.net/dati\" --recursive\nazcopy sync \"./unacartella\" \"https://$SA.blob.core.windows.net/dati\" --recursive\n\n# --- replica degli oggetti\nSA2=stdest$RANDOM\naz storage account create -n $SA2 -g $RG -l northeurope --sku Standard_LRS\n\naz storage account blob-service-properties update --account-name $SA -g $RG \\\n  --enable-versioning true --enable-change-feed true\naz storage account blob-service-properties update --account-name $SA2 -g $RG \\\n  --enable-versioning true\n\naz storage container create --account-name $SA2 -n dati --auth-mode login\n\naz storage account or-policy create --account-name $SA2 -g $RG \\\n  --source-account $SA --destination-account $SA2 \\\n  --source-container dati --destination-container dati","verifica":"`az storage account or-policy list --account-name $SA2 -g $RG` mostra la policy con il suo `policyId`. Un blob caricato nell'origine compare nella destinazione entro qualche minuto — non subito.","pulizia":"Adesso sì, si butta tutto:\n\n`az group delete -n rg-lab-st --yes --no-wait`\n\nControlla dopo qualche minuto con `az group exists -n rg-lab-st` che risponda `false`.","lab":{"t":"Lab 07 ufficiale: Manage Azure storage","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_07-Manage_Azure_Storage.html"}},{"id":"P14","d":3,"t":"Bicep e ARM: leggere, modificare, distribuire, esportare","min":40,"costo":"centesimi","obiettivi":["Interpret an Azure Resource Manager template or a Bicep file","Modify an existing Azure Resource Manager template","Modify an existing Bicep file","Deploy resources by using an Azure Resource Manager template or a Bicep file","Export a deployment as an Azure Resource Manager template or convert an Azure Resource Manager template to a Bicep file"],"perche":"Cinque obiettivi in un lab solo, e l'esame ti mette davanti un pezzo di template chiedendo cosa fa. Le due cose che contano: la differenza fra `parameters` e `variables`, e cosa succede in modalità **Complete** — cancella dal resource group tutto ciò che non è nel template. È la domanda che fa più danni.","serve":"Una sottoscrizione. La Cloud Shell ha già `az bicep`.","passi":["Scrivi un file Bicep minimo con un parametro, un default e un output.","Lancia `what-if` **prima** di distribuire: ti dice cosa cambierebbe senza cambiarlo. È lo strumento che l'esame associa a «verificare senza rischiare».","Distribuisci, poi rilancia lo stesso comando: la seconda volta non cambia niente. Le distribuzioni sono idempotenti.","Esporta il resource group come template ARM e guarda quanto è più verboso del Bicep.","Converti l'ARM esportato in Bicep con `decompile`: è la direzione che l'esame chiama «convert».","**Leggi ma non lanciare** il comando in modalità Complete: in questo resource group cancellerebbe tutto quello che non è nel template. Sapere che esiste basta."],"cli":"RG=rg-lab-arm\naz group create -n $RG -l westeurope\n\ncat > main.bicep <<'FINE'\nparam nome string\nparam posizione string = resourceGroup().location\n\nvar tagComuni = {\n  ambiente: 'lab'\n}\n\nresource sa 'Microsoft.Storage/storageAccounts@2023-01-01' = {\n  name: nome\n  location: posizione\n  tags: tagComuni\n  sku: { name: 'Standard_LRS' }\n  kind: 'StorageV2'\n}\n\noutput indirizzoBlob string = sa.properties.primaryEndpoints.blob\nFINE\n\nNOME=stbicep$RANDOM\n\n# prima guarda cosa farebbe\naz deployment group what-if -g $RG --template-file main.bicep --parameters nome=$NOME\n\n# poi fallo\naz deployment group create -g $RG --template-file main.bicep --parameters nome=$NOME\n\n# esporta in ARM e riconverti in Bicep\naz group export --name $RG > esportato.json\naz bicep decompile --file esportato.json\n\n# NON lanciarlo: cancellerebbe tutto cio' che non e' nel template\n# az deployment group create -g $RG --template-file main.bicep --mode Complete ...","verifica":"La distribuzione stampa `provisioningState: Succeeded` e l'output `indirizzoBlob`. Il secondo `what-if` non elenca modifiche: è la prova che il template descrive uno stato, non una sequenza di azioni.","pulizia":"`az group delete -n rg-lab-arm --yes --no-wait`\n`rm main.bicep esportato.json esportato.bicep`","lab":{"t":"Lab 03 ufficiale: Manage Azure resources by using ARM Templates","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_03b-Manage_Azure_Resources_by_Using_ARM_Templates.html"}},{"id":"P15","d":3,"t":"Una macchina virtuale, i suoi dischi e la sua taglia","min":40,"costo":"ore","obiettivi":["Create a virtual machine","Manage virtual machine sizes","Manage virtual machine disks"],"perche":"Il dominio più pesante dell'esame comincia da qui. Le regole da avere nelle mani: per **ridimensionare** spesso va deallocata, un disco si **allarga** ma non si stringe mai, e una VM **spenta dal sistema operativo** continua a costare — solo `deallocate` ferma il conto.","serve":"Una sottoscrizione. **Questa VM costa a ore**: una B1s è di pochi centesimi l'ora, ma se resta accesa un mese si sente. Dealloca appena hai finito.","passi":["Crea una VM Linux piccola con IP pubblico.","Guarda le taglie disponibili nella region, poi dealloca e ridimensiona. Riavvia e verifica.","Aggiungi un disco dati nuovo da 32 GB, poi allargalo a 64. Prova a riportarlo a 32: non si può, e non c'è un modo.","Guarda la differenza fra `Stop` dal sistema operativo, `az vm stop` e `az vm deallocate` nello stato della VM: solo l'ultimo porta a `VM deallocated` e ferma la fatturazione del calcolo. **I dischi si pagano lo stesso.**","Nota il tipo di disco: `Premium_LRS`, `StandardSSD_LRS`, `Standard_LRS`. Il cambio si fa a VM deallocata."],"cli":"RG=rg-lab-vm\naz group create -n $RG -l westeurope\n\naz vm create -g $RG -n vm-lab \\\n  --image Ubuntu2204 --size Standard_B1s \\\n  --admin-username azureuser --generate-ssh-keys \\\n  --public-ip-sku Standard\n\n# taglie disponibili qui\naz vm list-sizes -l westeurope --query \"[?contains(name,'Standard_B')].{taglia:name, cpu:numberOfCores, ram:memoryInMb}\" -o table\n\n# ridimensiona\naz vm deallocate -g $RG -n vm-lab\naz vm resize -g $RG -n vm-lab --size Standard_B2s\naz vm start -g $RG -n vm-lab\n\n# disco dati: si allarga, non si stringe\naz vm disk attach -g $RG --vm-name vm-lab --name disco-dati \\\n  --new --size-gb 32 --sku StandardSSD_LRS\naz vm deallocate -g $RG -n vm-lab\naz disk update -g $RG -n disco-dati --size-gb 64\naz disk update -g $RG -n disco-dati --size-gb 32   # fallisce, ed e' definitivo\n\n# lo stato che conta per la bolletta\naz vm get-instance-view -g $RG -n vm-lab --query \"instanceView.statuses[1].displayStatus\" -o tsv","verifica":"Dopo `deallocate` lo stato è `VM deallocated`; dopo `az vm stop` è `VM stopped`, e in quello stato **stai ancora pagando il calcolo**. Il comando che riporta il disco a 32 GB esce con un errore esplicito: quella è la risposta a una domanda d'esame ricorrente.","pulizia":"**Fallo subito, è la voce più cara di tutti i lab:**\n\n`az group delete -n rg-lab-vm --yes --no-wait`\n\nControlla dopo qualche minuto: `az group exists -n rg-lab-vm`. Se stai facendo anche P16 e P17, tieni il gruppo fino alla fine di P17 ma **dealloca la VM** fra una sessione e l'altra.","lab":{"t":"Lab 08 ufficiale: Manage Virtual Machines","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_08-Manage_Virtual_Machines.html"}},{"id":"P16","d":3,"t":"Encryption at host, e spostare una VM","min":30,"costo":"ore","obiettivi":["Configure encryption at host for Azure virtual machines","Move a virtual machine to another resource group, subscription, or region"],"perche":"**Encryption at host è l'unica novità vera della versione d'esame del 17 aprile 2026**: ha preso il posto di Azure Disk Encryption. Vale la pena farla una volta, perché ha due prerequisiti che l'esame usa come distrattori: la **feature va registrata sulla sottoscrizione** e la VM va **deallocata**. Lo spostamento invece ha la regola che frega tutti: dischi, NIC e IP devono spostarsi *insieme* alla VM.","serve":"La VM del lab P15. La registrazione della feature può metterci qualche minuto.","passi":["Registra la feature `EncryptionAtHost` e aspetta che risulti `Registered`.","Dealloca la VM e attiva la cifratura sull'host. Con la VM accesa il comando fallisce.","Riavvia e rileggi il profilo di sicurezza.","Crea un secondo resource group e sposta la VM: elenca **tutti** gli id collegati, non solo quello della VM. Con il solo id della VM il comando si rifiuta.","Nota che questo sposta fra resource group e sottoscrizioni, **non fra region**: per cambiare region servono Azure Resource Mover o Site Recovery. L'esame lo chiede spesso."],"cli":"az feature register --namespace Microsoft.Compute --name EncryptionAtHost\naz feature show --namespace Microsoft.Compute --name EncryptionAtHost \\\n  --query properties.state -o tsv          # aspetta 'Registered'\naz provider register -n Microsoft.Compute\n\naz vm deallocate -g $RG -n vm-lab\naz vm update -g $RG -n vm-lab --set securityProfile.encryptionAtHost=true\naz vm start -g $RG -n vm-lab\n\naz vm show -g $RG -n vm-lab --query securityProfile\n\n# --- spostamento: tutto insieme\naz group create -n rg-lab-vm2 -l westeurope\nIDS=$(az resource list -g $RG --query \"[].id\" -o tsv | tr '\\n' ' ')\naz resource move --destination-group rg-lab-vm2 --ids $IDS","verifica":"`securityProfile` mostra `encryptionAtHost: true`. Se il comando di update fallisce dicendo che la taglia non è supportata, non hai sbagliato: **non tutte le taglie supportano encryption at host**, ed è un'altra cosa che l'esame chiede.","pulizia":"`az group delete -n rg-lab-vm2 --yes --no-wait`\n\nLa feature registrata non costa niente e può restare.","lab":{"t":"Lab 08 ufficiale: Manage Virtual Machines","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_08-Manage_Virtual_Machines.html"}},{"id":"P17","d":3,"t":"Zone, set di disponibilità e scale set","min":40,"costo":"ore","obiettivi":["Deploy virtual machines to availability zones and availability sets","Deploy and configure an Azure Virtual Machine Scale Sets"],"perche":"Qui l'esame chiede numeri e vincoli: un **availability set** protegge dai guasti dentro un datacenter (fault e update domain), le **zone** proteggono dal datacenter intero, e hanno SLA diversi. Il vincolo che casca sempre: una VM **non si può aggiungere a un set dopo**, va ricreata.","serve":"Una sottoscrizione, e una region con zone di disponibilità (westeurope ce le ha). **Si paga a ore**: due istanze di scale set contano come due VM.","passi":["Crea un availability set con 2 fault domain e 5 update domain, e mettici dentro una VM alla creazione.","Prova ad aggiungere al set una VM già esistente: non c'è un comando che lo faccia. Va ricreata dal disco.","Crea una VM in **zona 1** e nota che la zona si sceglie alla creazione e non si cambia.","Crea uno scale set con 2 istanze, poi portalo a 3 a mano.","Aggiungi una regola di **autoscale** su CPU e leggi come è fatta: metrica, soglia, finestra, di quanto scala. L'esame te la mostra e chiede cosa succede."],"cli":"RG=rg-lab-ha\naz group create -n $RG -l westeurope\n\n# set di disponibilita'\naz vm availability-set create -g $RG -n avset \\\n  --platform-fault-domain-count 2 --platform-update-domain-count 5\n\naz vm create -g $RG -n vm-set --availability-set avset \\\n  --image Ubuntu2204 --size Standard_B1s \\\n  --admin-username azureuser --generate-ssh-keys\n\n# zona: si sceglie ora o mai piu'\naz vm create -g $RG -n vm-zona --zone 1 \\\n  --image Ubuntu2204 --size Standard_B1s \\\n  --admin-username azureuser --generate-ssh-keys --public-ip-sku Standard\n\n# scale set\naz vmss create -g $RG -n vmss-lab \\\n  --image Ubuntu2204 --vm-sku Standard_B1s --instance-count 2 \\\n  --admin-username azureuser --generate-ssh-keys\n\naz vmss scale -g $RG -n vmss-lab --new-capacity 3\n\n# autoscale\naz monitor autoscale create -g $RG --name auto-vmss \\\n  --resource vmss-lab --resource-type Microsoft.Compute/virtualMachineScaleSets \\\n  --min-count 2 --max-count 5 --count 2\n\naz monitor autoscale rule create -g $RG --autoscale-name auto-vmss \\\n  --condition \"Percentage CPU > 70 avg 5m\" --scale out 1","verifica":"`az vmss list-instances -g $RG -n vmss-lab -o table` elenca 3 istanze. `az monitor autoscale show -g $RG -n auto-vmss` mostra la regola con soglia 70 e finestra di 5 minuti: sono esattamente i campi che l'esame ti fa leggere.","pulizia":"**Qui ci sono cinque macchine che girano. Non lasciarle:**\n\n`az group delete -n rg-lab-ha --yes --no-wait`\n\nE se non l'hai già fatto: `az group delete -n rg-lab-vm --yes --no-wait`","lab":{"t":"Lab 08 ufficiale: Manage Virtual Machines","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_08-Manage_Virtual_Machines.html"}},{"id":"P18","d":3,"t":"Container: registro, istanze e Container Apps","min":40,"costo":"ore","obiettivi":["Create and manage an Azure Container Registry","Provision a container by using Azure Container Instances","Provision a container by using Azure Container Apps","Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps"],"perche":"L'esame chiede **quale dei tre** usare: ACI per un container singolo che parte e finisce, Container Apps quando serve scalare (anche **a zero**) e avere revisioni. E su ACR chiede la differenza fra gli SKU: solo **Premium** ha la replica geografica.","serve":"Una sottoscrizione. **ACR Basic costa qualche euro al mese** e Container Apps ha un piano gratuito mensile ma l'ambiente resta attivo: cancella tutto a fine lab.","passi":["Crea un ACR **Basic** e nota negli SKU cosa cambia: spazio incluso, webhook, replica geografica solo in Premium.","Costruisci un'immagine direttamente nel registro con `az acr build`: non serve Docker in locale.","Avvia un container con **ACI** partendo da un'immagine pubblica, con CPU e memoria dichiarate e un nome DNS.","Guarda `restart policy`: `Always`, `OnFailure`, `Never`. Per un job che deve finire, `Always` è la risposta sbagliata.","Crea un ambiente **Container Apps** e un'app con ingress esterno e `min-replicas 0`: quando nessuno la chiama, scende a zero e non costa. È la differenza che l'esame cerca."],"cli":"RG=rg-lab-cnt\naz group create -n $RG -l westeurope\n\n# registro\nACR=acrlab$RANDOM\naz acr create -g $RG -n $ACR --sku Basic\naz acr show -n $ACR --query \"{sku:sku.name, server:loginServer}\"\n\n# istanza singola\naz container create -g $RG -n aci-lab \\\n  --image mcr.microsoft.com/azuredocs/aci-helloworld \\\n  --ports 80 --ip-address Public \\\n  --cpu 1 --memory 1.5 \\\n  --restart-policy OnFailure \\\n  --dns-name-label acilab$RANDOM\n\naz container show -g $RG -n aci-lab --query \"{stato:instanceView.state, fqdn:ipAddress.fqdn}\"\n\n# container apps, con scala a zero\naz containerapp env create -g $RG -n env-lab -l westeurope\n\naz containerapp create -g $RG -n app-lab --environment env-lab \\\n  --image mcr.microsoft.com/azuredocs/containerapps-helloworld:latest \\\n  --target-port 80 --ingress external \\\n  --min-replicas 0 --max-replicas 3","verifica":"L'FQDN dell'ACI risponde nel browser. `az containerapp show -g $RG -n app-lab --query properties.configuration.ingress.fqdn` dà l'indirizzo dell'app; dopo qualche minuto senza traffico le repliche scendono a zero e la prima chiamata successiva è più lenta — è il **cold start**, ed è il prezzo dello scale-to-zero.","pulizia":"`az group delete -n rg-lab-cnt --yes --no-wait`\n\nL'ambiente Container Apps ci mette qualche minuto ad andarsene: ricontrolla con `az group exists -n rg-lab-cnt`.","lab":{"t":"Lab 09b ufficiale: Implement Azure Container Instances","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_09b-Implement_Azure_Container_Instances.html"}},{"id":"P19","d":3,"t":"App Service: piano, app, scalabilità e slot","min":40,"costo":"ore","obiettivi":["Provision an App Service plan","Create an App Service","Configure scaling for an App Service plan","Configure deployment slots for an App Service"],"perche":"Il nocciolo qui è che **il piano decide cosa puoi fare**. Con **B1** non hai né slot né autoscale: sono di Standard in su. È il tipo di vincolo che l'esame trasforma in «l'utente non trova l'opzione, perché?».","serve":"Una sottoscrizione. **B1 e S1 si pagano a ore.** Il piano F1 gratuito esiste ma non ha slot né scale, quindi per questo lab serve almeno B1.","passi":["Crea un piano **B1** Linux e una web app sopra.","Prova a creare uno slot: fallisce. Il messaggio nomina lo SKU.","Porta il piano a **S1** e riprova: adesso lo slot si crea.","Fai lo **swap** fra staging e produzione e guarda cosa si porta dietro: le impostazioni marcate come *deployment slot setting* **restano** dove sono, le altre viaggiano con l'app.","Distingui **scale up** (cambiare SKU del piano) da **scale out** (più istanze dello stesso piano): sono due voci diverse nel portale, e l'esame le confronta.","Aggiungi una regola di autoscale sul piano e nota che con B1 non compare proprio."],"cli":"RG=rg-lab-app\naz group create -n $RG -l westeurope\nAPP=webapp$RANDOM\n\n# B1: niente slot, niente autoscale\naz appservice plan create -g $RG -n plan-lab --sku B1 --is-linux\naz webapp create -g $RG -p plan-lab -n $APP --runtime \"NODE:20-lts\"\n\naz webapp deployment slot create -g $RG -n $APP --slot staging   # fallisce con B1\n\n# scale up: cambia lo SKU del piano\naz appservice plan update -g $RG -n plan-lab --sku S1\n\naz webapp deployment slot create -g $RG -n $APP --slot staging   # ora va\naz webapp deployment slot swap -g $RG -n $APP --slot staging --target-slot production\n\n# scale out: piu' istanze dello stesso piano\naz appservice plan update -g $RG -n plan-lab --number-of-workers 3\n\naz appservice plan show -g $RG -n plan-lab \\\n  --query \"{sku:sku.name, istanze:sku.capacity}\"","verifica":"Il primo comando di slot esce con un errore che cita lo SKU; dopo il passaggio a S1 lo stesso comando riesce. È la dimostrazione pratica della domanda «perché non vedo gli slot».","pulizia":"**S1 con 3 istanze è la configurazione più cara di questa pagina.** Prima riporta le istanze a 1, poi butta tutto:\n\n`az appservice plan update -g rg-lab-app -n plan-lab --number-of-workers 1`\n`az group delete -n rg-lab-app --yes --no-wait`","lab":{"t":"Lab 09a ufficiale: Implement Web Apps","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_09a-Implement_Web_Apps.html"}},{"id":"P20","d":3,"t":"App Service: TLS, dominio, backup e rete","min":30,"costo":"ore","obiettivi":["Configure certificates and Transport Layer Security (TLS) for an App Service","Map an existing custom DNS name to an App Service","Configure backup for an App Service","Configure networking settings for an App Service"],"perche":"Quattro obiettivi che l'esame tratta come una lista di prerequisiti. Il **certificato gestito gratuito** esiste ma solo *dopo* aver mappato un dominio tuo; il **backup** vuole almeno Standard e un container di storage; l'**integrazione VNet** esce dall'app verso la rete, il **private endpoint** entra dalla rete verso l'app. Confonderli è l'errore classico.","serve":"L'app del lab P19, sul piano S1. Per il dominio personalizzato serve un dominio vero: se non ce l'hai, fai i passi come lettura guidata nel portale.","passi":["In `Custom domains` guarda i record che Azure chiede: un **CNAME** verso `<app>.azurewebsites.net` più un **TXT** di verifica `asuid.<sottodominio>`. Sapere quali sono i due record è già mezza domanda d'esame.","In `TLS/SSL settings` nota che il **certificato gestito gratuito** compare solo dopo la mappatura del dominio, e che `HTTPS Only` e la **versione minima di TLS** sono due interruttori distinti.","Attiva `HTTPS Only` e imposta TLS minimo 1.2 dalla CLI.","Configura un **backup**: serve un account di archiviazione con un container e un SAS. Nota che il backup include anche il database collegato, se lo dichiari.","In `Networking` distingui le tre voci: **VNet integration** (traffico in uscita), **private endpoint** (accesso in ingresso privato), **access restrictions** (regole per IP). L'esame le mette come opzioni della stessa domanda."],"cli":"APP=<la tua app>\nRG=rg-lab-app\n\n# TLS: due interruttori diversi\naz webapp update -g $RG -n $APP --https-only true\naz webapp config set -g $RG -n $APP --min-tls-version 1.2\n\naz webapp config show -g $RG -n $APP \\\n  --query \"{tlsMinimo:minTlsVersion, soloHttps:httpsOnly}\"\n\n# restrizioni per IP\naz webapp config access-restriction add -g $RG -n $APP \\\n  --rule-name solo-io --action Allow --ip-address $(curl -s https://api.ipify.org)/32 --priority 100\n\naz webapp config access-restriction show -g $RG -n $APP\n\n# integrazione con la rete (uscita): serve una subnet delegata\n# az webapp vnet-integration add -g $RG -n $APP --vnet <vnet> --subnet <subnet>","verifica":"`httpsOnly` è `true` e `minTlsVersion` è `1.2`. Dopo la regola di restrizione, aprire l'app da un altro indirizzo — per esempio dal telefono in rete mobile — dà 403: è il modo più rapido per vedere che ha funzionato.","pulizia":"Togli la restrizione se vuoi continuare a usare l'app, poi butta il gruppo:\n\n`az webapp config access-restriction remove -g rg-lab-app -n $APP --rule-name solo-io`\n`az group delete -n rg-lab-app --yes --no-wait`","lab":{"t":"Lab 09a ufficiale: Implement Web Apps","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_09a-Implement_Web_Apps.html"}},{"id":"P21","d":4,"t":"Reti virtuali, subnet, peering e IP pubblici","min":35,"costo":"gratis","obiettivi":["Create and configure virtual networks and subnets","Create and configure virtual network peering","Configure public IP addresses"],"perche":"Due fatti che l'esame chiede in continuazione: Azure si tiene **5 indirizzi per subnet** (il primo e l'ultimo più tre), e il **peering non è transitivo** — se A vede B e B vede C, A non vede C. E fra gli IP pubblici, **Basic e Standard** hanno comportamenti diversi sulle zone e sul traffico in uscita.","serve":"Una sottoscrizione. VNet, subnet, peering e un IP pubblico non usato non costano niente.","passi":["Crea tre VNet con spazi che non si sovrappongono: A, B, C. Se si sovrappongono, il peering si rifiuta — è la prima cosa che l'esame fa sbagliare.","Aggiungi una seconda subnet ad A e conta gli indirizzi utilizzabili: su un /24 sono 251, non 254.","Crea il peering A↔B e B↔C. Il peering va creato **da tutte e due le parti**: una sola metà lascia lo stato `Initiated` invece di `Connected`.","Verifica che A non veda C: è la non transitività.","Crea un IP pubblico **Standard** statico e guarda la differenza con Basic: Standard è sempre statico, supporta le zone ed è quello richiesto dal Load Balancer Standard."],"cli":"RG=rg-lab-net\naz group create -n $RG -l westeurope\n\naz network vnet create -g $RG -n vnet-a --address-prefix 10.0.0.0/16 \\\n  --subnet-name web --subnet-prefix 10.0.1.0/24\naz network vnet create -g $RG -n vnet-b --address-prefix 10.1.0.0/16 \\\n  --subnet-name web --subnet-prefix 10.1.1.0/24\naz network vnet create -g $RG -n vnet-c --address-prefix 10.2.0.0/16 \\\n  --subnet-name web --subnet-prefix 10.2.1.0/24\n\naz network vnet subnet create -g $RG --vnet-name vnet-a -n dati \\\n  --address-prefix 10.0.2.0/24\n\n# quanti indirizzi restano davvero\naz network vnet subnet show -g $RG --vnet-name vnet-a -n web \\\n  --query \"{prefisso:addressPrefix, liberi:availableIpAddressCount}\"\n\n# peering: due volte, uno per verso\naz network vnet peering create -g $RG -n a-b --vnet-name vnet-a \\\n  --remote-vnet vnet-b --allow-vnet-access\naz network vnet peering create -g $RG -n b-a --vnet-name vnet-b \\\n  --remote-vnet vnet-a --allow-vnet-access\n\naz network vnet peering list -g $RG --vnet-name vnet-a -o table\n\n# IP pubblico Standard\naz network public-ip create -g $RG -n ip-lab --sku Standard --allocation-method Static","verifica":"`availableIpAddressCount` su un /24 dice 251: sono i 5 indirizzi che Azure si riserva. Il peering risulta `Connected` solo dopo aver creato entrambi i versi; con uno solo resta `Initiated`, ed è il guasto che l'esame descrive.","pulizia":"Tieni questo resource group fino alla fine dei lab di rete, poi:\n\n`az group delete -n rg-lab-net --yes --no-wait`","lab":{"t":"Lab 04 ufficiale: Implement Virtual Networking","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_04-Implement_Virtual_Networking.html"}},{"id":"P22","d":4,"t":"NSG, gruppi di sicurezza applicativi e regole effettive","min":35,"costo":"ore","obiettivi":["Create and configure network security groups (NSGs) and application security groups","Evaluate effective security rules in NSGs"],"perche":"L'esame mostra una lista di regole e chiede se un pacchetto passa. Le regole da avere in testa: vince la **priorità più bassa**, ci sono regole predefinite invisibili che permettono il traffico dentro la VNet e negano tutto il resto, e se hai un NSG **sia sulla subnet sia sulla NIC** devono lasciar passare **tutti e due**.","serve":"Una VM piccola nella VNet del lab P21. Si paga a ore: dealloca a fine sessione.","passi":["Crea una VM nella subnet `web`, poi un NSG sulla subnet e uno sulla NIC.","Sul primo consenti la porta 80, sul secondo no. Prova a raggiungerla: non passa. Poi apri anche il secondo.","Guarda le **regole effettive** sulla NIC: è la schermata che l'esame ti fa leggere, con le regole tue e quelle predefinite tutte insieme.","Crea un **ASG**, associalo alla configurazione IP della NIC, e scrivi una regola che come destinazione usa l'ASG invece di un indirizzo. È il modo di scrivere regole che non invecchiano quando cambi gli IP.","Guarda le regole predefinite: `AllowVnetInBound`, `AllowAzureLoadBalancerInBound`, `DenyAllInBound`. Quella dell'load balancer è la ragione per cui un LB funziona senza che tu apra niente."],"cli":"az vm create -g $RG -n vm-web --vnet-name vnet-a --subnet web \\\n  --image Ubuntu2204 --size Standard_B1s \\\n  --admin-username azureuser --generate-ssh-keys --public-ip-sku Standard\n\naz network nsg create -g $RG -n nsg-subnet\naz network nsg create -g $RG -n nsg-nic\n\naz network nsg rule create -g $RG --nsg-name nsg-subnet -n http \\\n  --priority 100 --direction Inbound --access Allow \\\n  --protocol Tcp --destination-port-ranges 80\n\naz network vnet subnet update -g $RG --vnet-name vnet-a -n web \\\n  --network-security-group nsg-subnet\n\nNIC=$(az vm show -g $RG -n vm-web --query \"networkProfile.networkInterfaces[0].id\" -o tsv)\naz network nic update --ids $NIC --network-security-group nsg-nic\n\n# le regole viste da chi decide davvero\naz network nic list-effective-nsg --ids $NIC \\\n  --query \"value[].effectiveSecurityRules[?access=='Allow'].{nome:name, porta:destinationPortRange, prio:priority}\" -o table\n\n# gruppo di sicurezza applicativo\naz network asg create -g $RG -n asg-web\naz network nic ip-config update --ids $NIC/ipConfigurations/ipconfigvm-web \\\n  --application-security-groups asg-web","verifica":"Con il solo NSG della subnet aperto sulla 80, la connessione non passa: il secondo NSG sulla NIC nega. Aperti tutti e due, passa. L'elenco delle regole effettive mostra anche `DenyAllInBound` con priorità 65500, che è la ragione per cui «non ho negato niente» non basta.","pulizia":"`az vm delete -g $RG -n vm-web --yes` — oppure lascia stare e cancella tutto il gruppo alla fine di P27. Nel frattempo: `az vm deallocate -g $RG -n vm-web`","lab":{"t":"Lab 04 ufficiale: Implement Virtual Networking","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_04-Implement_Virtual_Networking.html"}},{"id":"P23","d":4,"t":"Route definite da te, e diagnosticare perché non passa","min":30,"costo":"ore","obiettivi":["Configure user-defined routes","Troubleshoot network connectivity"],"perche":"Le UDR sono il modo per rompere una rete che funzionava, ed è per questo che l'esame le ama. Gli strumenti di diagnosi — **IP flow verify** dice quale regola NSG ha bloccato, **Next hop** dice dove sta andando il pacchetto — sono le due risposte più frequenti alla domanda «con quale strumento lo scopri».","serve":"La VM e la VNet dei lab precedenti.","passi":["Guarda le route effettive della NIC **prima** di toccare niente: ci sono già, create da Azure.","Crea una route table con una rotta `0.0.0.0/0` verso `None` e associala alla subnet: hai appena buttato via Internet.","Riguarda le route effettive: la tua ha sostituito quella di sistema. Le UDR **vincono sempre** sulle route predefinite.","Usa **Next hop** per vedere dove finisce un pacchetto diretto a un indirizzo pubblico: risponde `None`.","Usa **IP flow verify** per una porta chiusa: ti dice esattamente il nome della regola NSG che nega.","Togli l'associazione e verifica che tutto torni."],"cli":"# com'era prima\naz network nic show-effective-route-table --ids $NIC -o table\n\naz network route-table create -g $RG -n rt-lab\naz network route-table route create -g $RG --route-table-name rt-lab \\\n  -n blocca-internet --address-prefix 0.0.0.0/0 --next-hop-type None\n\naz network vnet subnet update -g $RG --vnet-name vnet-a -n web --route-table rt-lab\n\n# com'e' adesso\naz network nic show-effective-route-table --ids $NIC -o table\n\n# dove va un pacchetto\naz network watcher show-next-hop -g $RG --vm vm-web \\\n  --source-ip 10.0.1.4 --dest-ip 8.8.8.8\n\n# quale regola blocca\naz network watcher test-ip-flow -g $RG --vm vm-web \\\n  --direction Inbound --protocol TCP \\\n  --local 10.0.1.4:22 --remote 1.2.3.4:12345\n\n# rimetti a posto\naz network vnet subnet update -g $RG --vnet-name vnet-a -n web --remove routeTable","verifica":"Dopo l'associazione, `show-next-hop` per 8.8.8.8 risponde `nextHopType: None`. `test-ip-flow` restituisce `Deny` insieme al **nome della regola** che ha deciso: quel campo è la risposta a metà delle domande di diagnosi.","pulizia":"L'importante è staccare la route table prima di dimenticartene, altrimenti i lab successivi non hanno rete:\n\n`az network vnet subnet update -g $RG --vnet-name vnet-a -n web --remove routeTable`\n`az network route-table delete -g $RG -n rt-lab`","lab":{"t":"Lab 06 ufficiale: Implement Network Traffic Management","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_06-Implement_Network_Traffic_Management.html"}},{"id":"P24","d":4,"t":"Azure Bastion","min":25,"costo":"ore","obiettivi":["Implement Azure Bastion"],"perche":"Un solo obiettivo, ma con un vincolo che l'esame chiede alla lettera: la subnet deve chiamarsi **esattamente** `AzureBastionSubnet` ed essere almeno **/26**. Sbagliare nome o dimensione è l'errore che la domanda descrive.","serve":"La VNet del lab P21. **Attenzione al costo: Bastion si paga a ore anche se non lo usi, ed è fra le voci più care.** Fallo in una sessione sola e cancellalo subito.","passi":["Crea la subnet con il nome esatto e prefisso /26.","Crea un IP pubblico **Standard** — Basic non è accettato.","Distribuisci Bastion e collegati alla VM dal portale: si apre nel browser, senza IP pubblico sulla VM e senza aprire la 22 o la 3389 dal mondo.","Prova a creare la subnet con un nome diverso: Bastion non la accetta. È il punto della domanda.","**Cancella Bastion appena hai finito.**"],"cli":"az network vnet subnet create -g $RG --vnet-name vnet-a \\\n  -n AzureBastionSubnet --address-prefix 10.0.3.0/26\n\naz network public-ip create -g $RG -n ip-bastion \\\n  --sku Standard --allocation-method Static\n\naz network bastion create -g $RG -n bastion-lab \\\n  --public-ip-address ip-bastion --vnet-name vnet-a \\\n  --location westeurope --sku Basic\n\n# collegati dal portale: VM -> Connect -> Bastion","verifica":"Dal portale la VM si apre in una scheda del browser senza che tu abbia un IP pubblico raggiungibile sulla porta 22. Se la creazione fallisce, leggi il messaggio: quasi sempre nomina la subnet o lo SKU dell'IP.","pulizia":"**Questa è la pulizia più importante di tutta la pagina.** Bastion continua a costare finché esiste:\n\n`az network bastion delete -g rg-lab-net -n bastion-lab`\n`az network public-ip delete -g rg-lab-net -n ip-bastion`\n\nVerifica con `az network bastion list -g rg-lab-net -o table` che l'elenco sia vuoto.","lab":{"t":"Lab 04 ufficiale: Implement Virtual Networking","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_04-Implement_Virtual_Networking.html"}},{"id":"P25","d":4,"t":"Endpoint di servizio contro endpoint privati","min":35,"costo":"centesimi","obiettivi":["Configure service endpoints for Azure platform as a service (PaaS)","Configure private endpoints for Azure PaaS"],"perche":"È la coppia che l'esame confonde di proposito. Il **service endpoint** lascia il traffico sulla rete Microsoft ma l'indirizzo resta pubblico; il **private endpoint** porta il servizio **dentro** la tua VNet con un IP privato, e si porta dietro una **zona DNS privata**. Se la risoluzione DNS non è a posto, il private endpoint c'è ma nessuno lo trova: è lo scenario di guasto più chiesto.","serve":"La VNet del lab P21 e un account di archiviazione.","passi":["Attiva il service endpoint `Microsoft.Storage` sulla subnet e aggiungi la subnet fra le regole di rete dell'account: adesso lo storage accetta quella subnet e rifiuta il resto.","Risolvi il nome dello storage dalla VM: risponde ancora un **indirizzo pubblico**. Il traffico ci arriva per una strada privata, ma il nome è quello di sempre.","Crea un **private endpoint** verso il blob dello stesso account, con la sua zona DNS privata.","Risolvi di nuovo il nome dalla VM: adesso risponde un **10.x**. È la differenza, e si vede solo così.","Guarda il nome della zona: `privatelink.blob.core.windows.net`. Quel `privatelink` è la parola che l'esame usa come indizio."],"cli":"SA=stpe$RANDOM\naz storage account create -n $SA -g $RG -l westeurope --sku Standard_LRS\n\n# --- service endpoint\naz network vnet subnet update -g $RG --vnet-name vnet-a -n web \\\n  --service-endpoints Microsoft.Storage\n\naz storage account network-rule add -n $SA -g $RG \\\n  --vnet-name vnet-a --subnet web\naz storage account update -n $SA -g $RG --default-action Deny\n\n# --- private endpoint\naz network vnet subnet update -g $RG --vnet-name vnet-a -n dati \\\n  --disable-private-endpoint-network-policies true\n\nSAID=$(az storage account show -n $SA -g $RG --query id -o tsv)\naz network private-endpoint create -g $RG -n pe-blob \\\n  --vnet-name vnet-a --subnet dati \\\n  --private-connection-resource-id $SAID --group-id blob \\\n  --connection-name conn-blob\n\naz network private-dns zone create -g $RG -n privatelink.blob.core.windows.net\naz network private-dns link vnet create -g $RG -n link-a \\\n  --zone-name privatelink.blob.core.windows.net --virtual-network vnet-a \\\n  --registration-enabled false\n\naz network private-endpoint dns-zone-group create -g $RG \\\n  --endpoint-name pe-blob -n zg --private-dns-zone privatelink.blob.core.windows.net \\\n  --zone-name blob","verifica":"Dalla VM, `nslookup $SA.blob.core.windows.net` risponde un indirizzo pubblico prima del private endpoint e un `10.0.2.x` dopo. Se dopo continua a rispondere pubblico, manca il collegamento fra zona DNS privata e VNet: è esattamente il guasto che l'esame descrive.","pulizia":"Va tutto via con il resource group alla fine di P27. Se vuoi liberare subito:\n\n`az network private-endpoint delete -g $RG -n pe-blob`\n`az storage account delete -n $SA -g $RG --yes`","lab":{"t":"Lab 05 ufficiale: Implement Intersite Connectivity","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_05-Implement_Intersite_Connectivity.html"}},{"id":"P26","d":4,"t":"Azure DNS, pubblico e privato","min":25,"costo":"centesimi","obiettivi":["Configure Azure DNS"],"perche":"L'esame chiede due cose: quali **name server** vanno comunicati al registrar per delegare un dominio, e la differenza fra zona **pubblica** e **privata**. Creare una zona costa pochi centesimi e chiarisce entrambe in venti minuti.","serve":"Una sottoscrizione. Non serve possedere un dominio: la zona si crea comunque, semplicemente nessuno la interroga da Internet finché non deleghi.","passi":["Crea una zona pubblica per un nome qualsiasi e leggi i **name server** che Azure ti assegna: sono i quattro `ns1-…` da dare al registrar. Senza quella delega, la zona esiste e non serve a niente.","Aggiungi un record A e uno CNAME e interrogali puntando direttamente ai name server di Azure con `dig` o `nslookup`.","Crea una zona **privata**, collegala alla VNet con la registrazione automatica attiva, e nota che le VM della rete ci si registrano da sole.","Confronta: la zona pubblica risponde a chiunque via Internet, quella privata solo dentro le VNet collegate."],"cli":"az network dns zone create -g $RG -n lab.example\n\naz network dns zone show -g $RG -n lab.example \\\n  --query nameServers -o tsv\n\naz network dns record-set a add-record -g $RG -z lab.example \\\n  -n www -a 203.0.113.10\naz network dns record-set cname set-record -g $RG -z lab.example \\\n  -n alias -c www.lab.example\n\n# interroga direttamente Azure, senza delega\nNS=$(az network dns zone show -g $RG -n lab.example --query \"nameServers[0]\" -o tsv)\nnslookup www.lab.example $NS\n\n# zona privata, con registrazione automatica\naz network private-dns zone create -g $RG -n interno.lab\naz network private-dns link vnet create -g $RG -n link-interno \\\n  --zone-name interno.lab --virtual-network vnet-a --registration-enabled true","verifica":"`nslookup` puntato al name server di Azure risolve `www.lab.example` anche senza delega: è la prova che la zona funziona e che manca solo il passaggio dal registrar. Nella zona privata, dopo qualche minuto compare il record della VM registrato da solo.","pulizia":"`az network dns zone delete -g $RG -n lab.example --yes`\n`az network private-dns link vnet delete -g $RG -n link-interno --zone-name interno.lab --yes`\n`az network private-dns zone delete -g $RG -n interno.lab --yes`","lab":{"t":"Lab 06 ufficiale: Implement Network Traffic Management","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_06-Implement_Network_Traffic_Management.html"}},{"id":"P27","d":4,"t":"Load balancer, e perché non bilancia","min":40,"costo":"ore","obiettivi":["Configure an internal or public load balancer","Troubleshoot load balancing"],"perche":"Il load balancer ha quattro pezzi — frontend, backend pool, **health probe**, regola — e l'esame chiede sempre quale manca. Nove volte su dieci la risposta è la **probe**: se fallisce, l'istanza esce dal pool e il traffico non ci arriva più, anche se la macchina è accesa e sana.","serve":"Due VM piccole nella stessa VNet. **Si paga a ore**: due VM più un LB Standard.","passi":["Crea due VM senza IP pubblico nella subnet `web` e installa un server web su entrambe, con una pagina che dica quale è.","Crea un load balancer **Standard** pubblico con frontend, backend pool, probe sulla 80 e regola.","Chiama l'IP del load balancer più volte: le risposte si alternano fra le due macchine.","**Rompi la probe**: cambiala su una porta dove non ascolta nessuno. Dopo qualche secondo il traffico si ferma, anche se le VM sono accese.","Guarda lo stato di salute del backend pool: le istanze risultano non integre. Quello è lo schermo che l'esame ti fa interpretare.","Rimetti la probe sulla 80 e verifica che riprenda."],"cli":"az network public-ip create -g $RG -n ip-lb --sku Standard --allocation-method Static\n\naz network lb create -g $RG -n lb-lab --sku Standard \\\n  --public-ip-address ip-lb \\\n  --frontend-ip-name fe --backend-pool-name be\n\naz network lb probe create -g $RG --lb-name lb-lab -n probe-http \\\n  --protocol Tcp --port 80\n\naz network lb rule create -g $RG --lb-name lb-lab -n regola-http \\\n  --protocol Tcp --frontend-port 80 --backend-port 80 \\\n  --frontend-ip-name fe --backend-pool-name be --probe-name probe-http\n\n# collega le NIC delle due VM al pool\nfor V in vm-web1 vm-web2; do\n  NICID=$(az vm show -g $RG -n $V --query \"networkProfile.networkInterfaces[0].id\" -o tsv)\n  az network nic ip-config address-pool add --ids $NICID/ipConfigurations/ipconfig$V \\\n    --lb-name lb-lab --address-pool be\ndone\n\n# rompi la probe di proposito\naz network lb probe update -g $RG --lb-name lb-lab -n probe-http --port 8080\n\n# rimetti a posto\naz network lb probe update -g $RG --lb-name lb-lab -n probe-http --port 80","verifica":"`curl` ripetuto sull'IP del load balancer alterna le due risposte. Con la probe sulla 8080 le chiamate vanno in timeout entro un minuto: le VM sono accese, il servizio risponde, e il traffico non arriva lo stesso. È la lezione del lab.","pulizia":"**Adesso si butta tutta la rete:**\n\n`az group delete -n rg-lab-net --yes --no-wait`\n\nControlla anche che Bastion sia già sparito da P24: `az network bastion list -o table`","lab":{"t":"Lab 06 ufficiale: Implement Network Traffic Management","u":"https://microsoftlearning.github.io/AZ-104-MicrosoftAzureAdministrator/Instructions/Labs/LAB_06-Implement_Network_Traffic_Management.html"}},{"id":"P28","d":5,"t":"Log Analytics, impostazioni di diagnostica e KQL","min":40,"costo":"centesimi","obiettivi":["Configure log settings in Azure Monitor","Query and analyze logs in Azure Monitor"],"perche":"La regola che l'esame chiede in mille modi: i **log non arrivano da soli**. Finché non crei un'impostazione di diagnostica che li manda a un workspace, la tabella è vuota. E poi ti mostra una query KQL chiedendo cosa restituisce: `where`, `summarize`, `project`, `ago()` sono il vocabolario minimo.","serve":"Una sottoscrizione e una risorsa qualsiasi da monitorare, per esempio un account di archiviazione.","passi":["Crea un workspace Log Analytics.","Crea un'impostazione di diagnostica su una risorsa, mandando log e metriche al workspace. Nota le categorie: quali log esistono dipende dal tipo di risorsa.","Aspetta qualche minuto — l'ingestione non è istantanea, ed è un'altra cosa che l'esame chiede.","Scrivi una query KQL: filtra con `where`, raggruppa con `summarize`, scegli le colonne con `project`.","Guarda la **ritenzione** del workspace e come si cambia: è la manopola che l'esame collega al costo.","Nota la differenza fra **metriche** (numeriche, immediate, ritenzione breve) e **log** (righe, ritardate, ritenzione configurabile)."],"cli":"RG=rg-lab-mon\naz group create -n $RG -l westeurope\n\naz monitor log-analytics workspace create -g $RG -n law-lab -l westeurope\nWS=$(az monitor log-analytics workspace show -g $RG -n law-lab --query id -o tsv)\n\nSA=stmon$RANDOM\naz storage account create -n $SA -g $RG -l westeurope --sku Standard_LRS\nSAID=$(az storage account show -n $SA -g $RG --query id -o tsv)\n\naz monitor diagnostic-settings create -n diag-storage \\\n  --resource \"$SAID/blobServices/default\" \\\n  --workspace $WS \\\n  --logs '[{\"category\":\"StorageRead\",\"enabled\":true}]' \\\n  --metrics '[{\"category\":\"Transaction\",\"enabled\":true}]'\n\n# ritenzione\naz monitor log-analytics workspace update -g $RG -n law-lab --retention-time 60\n\n# una query, dopo qualche minuto\naz monitor log-analytics query -w $(az monitor log-analytics workspace
