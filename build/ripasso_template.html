/* ---------- barra di sito ----------

<script>
  const BANCA = /*__DATI__*/[];

  const DOMINI = {
    1: "Identità e governance",
    2: "Storage",
    3: "Compute",
    4: "Networking",
    5: "Monitoraggio",
  };
  const TIPI = {
    multiple_choice: "Scelta singola",
    multiple_response: "Scelta multipla",
    hotspot: "Hotspot",
    yes_no_series: "Serie Sì/No",
    drag_drop: "Ordinamento",
    case_study: "Case study",
  };
  const DIFF = { 1: "Base", 2: "Applicativa", 3: "Scenario" };
  const LETTERE = ["A", "B", "C", "D", "E"];

  /* ---------- stato persistente ---------- */

  const CHIAVE = "az104-ripasso-v1";
  let memoriaVolatile = false;

  function carica() {
    try {
      const raw = localStorage.getItem(CHIAVE);
      return raw ? JSON.parse(raw) : {};
    } catch (err) {
      memoriaVolatile = true;
      return {};
    }
  }

  function salva() {
    if (memoriaVolatile) return;
    try {
      localStorage.setItem(CHIAVE, JSON.stringify(segni));
    } catch (err) {
      memoriaVolatile = true;
    }
  }

  // { "AZ104-0001": "ok" | "rev" }
  let segni = carica();

  const filtri = { dom: new Set(), tipo: new Set(), diff: new Set(), mark: new Set(), q: "" };
  let ordine = BANCA.map((_, i) => i);
  let vista = [];
  let cursore = 0;
  let mostrata = false;

  /* ---------- filtro ---------- */

  function passa(d) {
    if (filtri.dom.size && !filtri.dom.has(d.d)) return false;
    if (filtri.tipo.size && !filtri.tipo.has(d.t)) return false;
    if (filtri.diff.size && !filtri.diff.has(d.df)) return false;
    if (filtri.mark.size) {
      const s = segni[d.id] || "new";
      if (!filtri.mark.has(s)) return false;
    }
    if (filtri.q) {
      const testo = (d.q + " " + d.e + " " + d.s + " " + d.tg.join(" ")).toLowerCase();
      if (!testo.includes(filtri.q)) return false;
    }
    return true;
  }

  function ricalcola(tieniPosizione = true) {
    const idCorrente = vista.length ? BANCA[vista[cursore]].id : null;
    vista = ordine.filter((i) => passa(BANCA[i]));
    if (tieniPosizione && idCorrente) {
      const trovato = vista.findIndex((i) => BANCA[i].id === idCorrente);
      cursore = trovato >= 0 ? trovato : 0;
    } else {
      cursore = 0;
    }
    disegna();
  }

  /* ---------- rendering ---------- */

  const esc = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function opzioniHtml(d) {
    if (d.t === "hotspot") {
      return d.o
        .map(
          (m) => `<div class="menu">
            <span class="menu-l">${esc(m.l)}</span>
            <div class="menu-c">${m.c
              .map((v) => `<span class="val ${v === m.k ? "hit" : "miss"}">${esc(v)}</span>`)
              .join("")}</div>
          </div>`
        )
        .join("");
    }

    if (d.t === "yes_no_series") {
      return `<ul class="opts">${d.o
        .map((o, i) => {
          const v = d.a[i];
          const si = v === "Yes";
          const nota = v === undefined;
          return `<li class="opt">
            <span class="verdict ${nota ? "hidden-v" : si ? "yes" : "no"}">${nota ? "—" : si ? "SÌ" : "NO"}</span>
            <span>${esc(o)}</span>
          </li>`;
        })
        .join("")}</ul>`;
    }

    if (d.t === "drag_drop") {
      // L'ordine arriva da --o, applicato solo sotto .revealed: prima del reveal
      // le azioni restano in ordine alfabetico e non anticipano la sequenza.
      // Una domanda può chiedere N azioni su più opzioni: le escluse sono distrattori.
      return `<ul class="opts">${d.o
        .map((o, i) => {
          const p = d.a.indexOf("abcde"[i]);
          const usata = p >= 0;
          return `<li class="opt ${usata ? "" : "miss"}" style="--o:${usata ? p : 90 + i}">
            <span class="ord">
              <span class="pre">${LETTERE[i]}</span>
              <span class="post">${usata ? p + 1 : "—"}</span>
            </span>
            <span>${esc(o)}</span>
          </li>`;
        })
        .join("")}</ul>`;
    }

    return `<ul class="opts">${d.o
      .map(
        (o, i) => `<li class="opt ${d.a.includes("abcde"[i]) ? "hit" : "miss"}">
          <span class="k">${LETTERE[i]}</span>
          <span>${esc(o)}</span>
        </li>`
      )
      .join("")}</ul>`;
  }

  function rispostaBreve(d) {
    if (d.t === "hotspot") return d.o.map((m) => m.k || "?").join(" · ");
    if (d.t === "yes_no_series") return d.a.map((v) => (v === "Yes" ? "SÌ" : "NO")).join(" · ");
    if (d.t === "drag_drop") return d.a.map((l) => l.toUpperCase()).join(" → ");
    return d.a.map((l) => l.toUpperCase()).join(" + ");
  }

  function disegna() {
    const stage = document.getElementById("stage");

    if (!vista.length) {
      stage.innerHTML = `<div class="empty">
        <p>Nessuna domanda con questi filtri.</p>
        <button class="link-btn" onclick="document.getElementById('btn-reset').click()">Azzera i filtri</button>
      </div>`;
      document.getElementById("counter").textContent = "0 / 0";
      document.getElementById("rail").style.width = "0%";
      aggiornaDock(null);
      return;
    }

    const d = BANCA[vista[cursore]];
    const drag = d.t === "drag_drop";

    stage.innerHTML = `<article class="card ${mostrata ? "revealed" : ""}" id="card">
      <div class="card-head">
        <span class="qid">${esc(d.id)}</span>
        <span class="tag">${esc(TIPI[d.t] || d.t)}</span>
        <span class="tag">${esc(DIFF[d.df])}</span>
        <span class="tag tag-check ${d.v ? "ver" : "unver"}">${d.v ? "✓ verificata" : "da rivedere"}</span>
      </div>
      <div class="card-body">
        <p class="dom">${esc(DOMINI[d.d])} — ${esc(d.s)}</p>
        <p class="q">${esc(d.q)}</p>
        ${drag && !mostrata ? '<p class="dom">Metti in ordine i passaggi, poi mostra la sequenza.</p>' : ""}
        ${opzioniHtml(d)}
        <button class="reveal-btn" id="reveal">Mostra risposta</button>
        <div class="answer">
          <div class="answer-head">
            <span class="answer-l">Risposta</span>
            <span class="answer-v">${esc(rispostaBreve(d))}</span>
          </div>
          <p class="why">${esc(d.e)}</p>
          <a class="src" href="${esc(d.u)}" target="_blank" rel="noopener noreferrer">↗ ${esc(
      d.u.replace("https://learn.microsoft.com", "learn.microsoft.com")
    )}</a>
          ${d.tg.length ? `<div class="kws">${d.tg.map((t) => `<span class="kw">${esc(t)}</span>`).join("")}</div>` : ""}
        </div>
      </div>
    </article>`;

    // Prima del reveal le classi hit/miss sono già nel markup ma restano
    // inerti: sono sotto .revealed nel CSS, quindi non colorano nulla.
    document.getElementById("reveal").addEventListener("click", () => {
      mostrata = true;
      document.getElementById("card").classList.add("revealed");
      document.getElementById("reveal").blur();
    });

    document.getElementById("counter").textContent = `${cursore + 1} / ${vista.length}`;
    const fatte = Object.keys(segni).length;
    document.getElementById("rail").style.width = `${(fatte / BANCA.length) * 100}%`;
    document.getElementById("prev").disabled = cursore === 0;
    document.getElementById("next").disabled = cursore === vista.length - 1;
    aggiornaDock(d);
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  function aggiornaDock(d) {
    const s = d ? segni[d.id] : null;
    document.getElementById("mark-ok").setAttribute("aria-pressed", String(s === "ok"));
    document.getElementById("mark-rev").setAttribute("aria-pressed", String(s === "rev"));
  }

  /* ---------- navigazione ---------- */

  function vai(delta) {
    const n = cursore + delta;
    if (n < 0 || n >= vista.length) return;
    cursore = n;
    mostrata = false;
    disegna();
  }

  function segna(valore) {
    if (!vista.length) return;
    const d = BANCA[vista[cursore]];
    segni[d.id] = segni[d.id] === valore ? undefined : valore;
    if (segni[d.id] === undefined) delete segni[d.id];
    salva();
    aggiornaDock(d);
    document.getElementById("rail").style.width = `${(Object.keys(segni).length / BANCA.length) * 100}%`;
    // Con un filtro sui segni attivo la domanda può uscire dalla vista: avanza.
    if (filtri.mark.size && !passa(d)) {
      const era = cursore;
      vista = ordine.filter((i) => passa(BANCA[i]));
      cursore = Math.min(era, Math.max(0, vista.length - 1));
      mostrata = false;
      disegna();
    } else if (segni[d.id]) {
      vai(1);
    }
  }

  document.getElementById("prev").addEventListener("click", () => vai(-1));
  document.getElementById("next").addEventListener("click", () => vai(1));
  document.getElementById("mark-ok").addEventListener("click", () => segna("ok"));
  document.getElementById("mark-rev").addEventListener("click", () => segna("rev"));

  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "ArrowLeft") vai(-1);
    if (e.key === "ArrowRight") vai(1);
    if (e.key === " " || e.key === "Enter") {
      const b = document.getElementById("reveal");
      if (b && !mostrata) { e.preventDefault(); b.click(); }
    }
  });

  /* ---------- filtri: costruzione chip ---------- */

  function conta(pred) {
    return BANCA.filter(pred).length;
  }

  function chip(testo, n, attivo) {
    return `<button class="chip" aria-pressed="${attivo}">${esc(testo)}<span class="n">${n}</span></button>`;
  }

  function montaChips(el, voci, insieme, chiave) {
    el.innerHTML = voci.map((v) => chip(v.label, v.n, insieme.has(v.val))).join("");
    [...el.children].forEach((b, i) => {
      b.addEventListener("click", () => {
        const v = voci[i].val;
        insieme.has(v) ? insieme.delete(v) : insieme.add(v);
        b.setAttribute("aria-pressed", String(insieme.has(v)));
        ricalcola(chiave !== "mark");
      });
    });
  }

  function montaFiltri() {
    montaChips(
      document.getElementById("f-dom"),
      Object.entries(DOMINI).map(([k, label]) => ({ label, val: +k, n: conta((d) => d.d === +k) })),
      filtri.dom,
      "dom"
    );
    montaChips(
      document.getElementById("f-tipo"),
      Object.entries(TIPI).map(([k, label]) => ({ label, val: k, n: conta((d) => d.t === k) })),
      filtri.tipo,
      "tipo"
    );
    montaChips(
      document.getElementById("f-diff"),
      Object.entries(DIFF).map(([k, label]) => ({ label, val: +k, n: conta((d) => d.df === +k) })),
      filtri.diff,
      "diff"
    );
    rimontaSegni();
  }

  function rimontaSegni() {
    const voci = [
      { label: "Mai viste", val: "new", n: conta((d) => !segni[d.id]) },
      { label: "Da rivedere", val: "rev", n: conta((d) => segni[d.id] === "rev") },
      { label: "Le sapevo", val: "ok", n: conta((d) => segni[d.id] === "ok") },
    ];
    montaChips(document.getElementById("f-mark"), voci, filtri.mark, "mark");
  }

  document.getElementById("btn-filters").addEventListener("click", (e) => {
    const aperto = document.getElementById("filters").classList.toggle("open");
    e.currentTarget.setAttribute("aria-pressed", String(aperto));
    if (aperto) rimontaSegni();
  });

  let debounce;
  document.getElementById("search").addEventListener("input", (e) => {
    clearTimeout(debounce);
    debounce = setTimeout(() => {
      filtri.q = e.target.value.trim().toLowerCase();
      ricalcola(false);
    }, 180);
  });

  document.getElementById("btn-shuffle").addEventListener("click", () => {
    for (let i = ordine.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [ordine[i], ordine[j]] = [ordine[j], ordine[i]];
    }
    mostrata = false;
    ricalcola(false);
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    filtri.dom.clear();
    filtri.tipo.clear();
    filtri.diff.clear();
    filtri.mark.clear();
    filtri.q = "";
    document.getElementById("search").value = "";
    montaFiltri();
    ricalcola(false);
  });

  document.getElementById("btn-export").addEventListener("click", () => {
    const righe = BANCA.filter((d) => segni[d.id]).map((d) => ({
      id: d.id,
      segno: segni[d.id],
      dominio: DOMINI[d.d],
      domanda: d.q.slice(0, 120),
    }));
    const blob = new Blob([JSON.stringify(righe, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "az104_segni.json";
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.getElementById("btn-wipe").addEventListener("click", () => {
    if (!confirm("Cancello tutti i segni? Le domande restano, i tuoi progressi no.")) return;
    segni = {};
    salva();
    rimontaSegni();
    ricalcola(false);
  });

  document.getElementById("btn-theme").addEventListener("click", () => {
    const attuale =
      document.documentElement.dataset.theme ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.dataset.theme = attuale === "dark" ? "light" : "dark";
  });

  /* ---------- avvio ---------- */

  montaFiltri();
  ricalcola(false);

  if (memoriaVolatile) {
    const n = document.getElementById("notice");
    n.hidden = false;
    n.innerHTML =
      "<strong>I progressi non vengono salvati.</strong> Questo browser blocca la memoria locale: " +
      "i segni valgono solo finché la pagina resta aperta. Usa <em>Esporta segni</em> prima di chiuderla.";
  }

/* Il pulsante Ricomincia della barra svuota la memoria locale, ma i segni
   restano in pagina: il primo click su "la sapevo" li riscriverebbe tutti. */
window.azzeraInMemoria = () => { Object.keys(segni).forEach(k => delete segni[k]); };

/* Ricomincia: le domande tornano tutte come non viste. Il pulsante sta nella
   barra di sito, quindi si trova da qualunque pagina.
   Non tocca la teoria: rifare le domande e' una cosa, dimenticare le lezioni
   un'altra. Per quelle c'e' "Azzera studiate e ascolti" sotto la tabella. */
(function ricomincia(){
  const b = document.getElementById("ricomincia");
  if(!b) return;
  const NL = String.fromCharCode(10);
  b.addEventListener("click", () => {
    if(!confirm(
      "Ricominciare le domande da zero?" + NL + NL +
      "Si azzerano: le risposte date, gli esiti, gli esami sostenuti e i segni" + NL +
      "« la sapevo / da rivedere » del ripasso." + NL + NL +
      "Restano: le tue note, le correzioni che hai salvato, e tutta la teoria." + NL + NL +
      "Non si torna indietro."
    )) return;
    try{
      const raw = localStorage.getItem("az104:user");
      if(raw){
        const u = JSON.parse(raw);
        u.prog = {};
        u.history = [];
        localStorage.setItem("az104:user", JSON.stringify(u));
      }
      localStorage.removeItem("az104-ripasso-v1");
    }catch(e){ /* browser senza memoria locale: non c'e' niente da azzerare */ }
    /* La pagina aperta puo' avere gli stessi dati gia' in memoria: senza questo,
       il primo salvataggio dopo il click li riscriverebbe come stavano. */
    if(typeof window.azzeraInMemoria === "function") window.azzeraInMemoria();
    location.reload();
  });
})();
</script>
