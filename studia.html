<title>Studia AZ-104 — teoria in italiano</title>

<style>
:root{
  --paper:#EEF1F2; --card:#FFFFFF; --card-2:#F7F9F9;
  --line:#D3DBDE; --line-2:#E4EAEC;
  --text:#101A22; --text-2:#4A5A63; --text-3:#71838C;
  --accent:#0F7C91; --accent-2:#0B5F70; --accent-soft:#DCEEF1;
  --signal:#C77F1A; --signal-soft:#FBF0DC;
  --good:#2E7D5B; --good-soft:#DDEFE6;
  --shadow:0 1px 2px rgba(16,26,34,.06),0 4px 16px rgba(16,26,34,.06);
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --font-dis:"Segoe UI Variable Display","Segoe UI Semibold","Segoe UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0B1319; --card:#141F27; --card-2:#101A21;
  --line:#2B3A45; --line-2:#22303A;
  --text:#E6EDEF; --text-2:#A3B4BD; --text-3:#7C8F99;
  --accent:#3AA8BE; --accent-2:#5FC2D6; --accent-soft:#15323A;
  --signal:#E0A244; --signal-soft:#33280F;
  --good:#4CAF83; --good-soft:#122C22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0B1319; --card:#141F27; --card-2:#101A21;
  --line:#2B3A45; --line-2:#22303A;
  --text:#E6EDEF; --text-2:#A3B4BD; --text-3:#7C8F99;
  --accent:#3AA8BE; --accent-2:#5FC2D6; --accent-soft:#15323A;
  --signal:#E0A244; --signal-soft:#33280F;
  --good:#4CAF83; --good-soft:#122C22;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 18px rgba(0,0,0,.3);
}
:root[data-theme="light"]{
  --paper:#EEF1F2; --card:#FFFFFF; --card-2:#F7F9F9;
  --line:#D3DBDE; --line-2:#E4EAEC;
  --text:#101A22; --text-2:#4A5A63; --text-3:#71838C;
  --accent:#0F7C91; --accent-2:#0B5F70; --accent-soft:#DCEEF1;
  --signal:#C77F1A; --signal-soft:#FBF0DC;
  --good:#2E7D5B; --good-soft:#DDEFE6;
  --shadow:0 1px 2px rgba(16,26,34,.06),0 4px 16px rgba(16,26,34,.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--font-ui);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%}
h1,h2,h3{font-family:var(--font-dis);margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
a{color:var(--accent-2)}

/* ---------- barra ---------- */
.top{position:sticky;top:38px;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:0 16px;height:54px}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--font-dis);font-weight:600;
  font-size:15px;white-space:nowrap}
.brand span{font-family:var(--font-mono);font-size:11px;font-weight:600;color:var(--accent);
  border:1px solid var(--accent);border-radius:3px;padding:1px 5px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:6px 11px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--text-2)}
.btn:hover{border-color:var(--accent);color:var(--accent-2)}
.cerca{background:var(--card-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;
  font-size:13.5px;width:210px;max-width:38vw}

/* ---------- impianto ---------- */
.wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:26px;
  max-width:1180px;margin:0 auto;padding:20px 16px 70px;align-items:start}
.rail{position:sticky;top:108px;max-height:calc(100vh - 130px);overflow-y:auto}
.dom-h{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);
  font-weight:600;margin:14px 0 5px;padding:0 4px}
.dom-h:first-child{margin-top:0}
.nav-l{display:block;width:100%;text-align:left;background:none;border:0;cursor:pointer;
  padding:5px 8px;border-radius:6px;font-size:13px;color:var(--text-2);line-height:1.35}
.nav-l:hover{background:var(--card);color:var(--text)}
.nav-l.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav-l.fatta::before{content:"✓ ";color:var(--good);font-weight:700}

/* ---------- lezione ---------- */
.intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;
  margin-bottom:18px;box-shadow:var(--shadow)}
.intro h1{font-size:21px;margin-bottom:7px}
.intro p{margin:0;color:var(--text-2);font-size:14px;max-width:66ch}
.lez{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;
  box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:104px}
.lez-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 20px;
  border-bottom:1px solid var(--line-2);background:var(--card-2)}
.lez-h h2{font-size:16.5px;flex:1;min-width:0}
.num{font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--accent-2)}
.obj{font-size:11px;color:var(--text-3);width:100%;font-family:var(--font-mono);line-height:1.4}
.lez-b{padding:16px 20px}
.sez{margin-bottom:15px}
.sez:last-child{margin-bottom:0}
.sez h3{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-3);
  margin-bottom:6px}
.sez p{margin:0 0 9px;max-width:70ch;line-height:1.62}
.sez p:last-child{margin-bottom:0}
.sez ul{margin:0 0 9px;padding-left:20px;max-width:70ch}
.sez li{margin-bottom:3px;line-height:1.55}
.sez code{font-family:var(--font-mono);font-size:.88em;background:var(--card-2);
  border:1px solid var(--line-2);border-radius:4px;padding:1px 5px}
.sez pre{margin:0 0 9px;padding:11px 13px;background:var(--card-2);border:1px solid var(--line-2);
  border-radius:7px;overflow-x:auto;font-family:var(--font-mono);font-size:12.5px;line-height:1.5}
.sez strong{font-weight:600;color:var(--text)}
.es{background:var(--card-2);border-left:3px solid var(--accent);border-radius:0 7px 7px 0;
  padding:12px 15px}
.es h3{color:var(--accent-2)}
.tr{background:var(--signal-soft);border-left:3px solid var(--signal);border-radius:0 7px 7px 0;
  padding:12px 15px}
.tr h3{color:var(--signal)}
.lez-f{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 20px;
  border-top:1px solid var(--line-2);background:var(--card-2)}
.lez-f a{font-size:12.5px;text-decoration:none;border-bottom:1px solid transparent}
.lez-f a:hover{border-bottom-color:var(--accent-2)}
.segna{margin-left:auto}
.segna.on{background:var(--good-soft);border-color:var(--good);color:var(--good);font-weight:600}
.vuoto{text-align:center;padding:50px 20px;color:var(--text-3)}

/* ---------- ascolto ---------- */
.voce{background:var(--card-2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;
  font-size:12.5px;max-width:210px}
.audio{display:flex;align-items:center;gap:7px}
.btn.play.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.volte{font-size:11.5px;color:var(--text-3);font-family:var(--font-mono)}
/* La frase in lettura: fondo tenue e sottolineatura, cosi' si segue con l'occhio
   anche da lontano. Niente animazioni: darebbero fastidio su un testo lungo. */
.frase.leggo{background:var(--accent-soft);border-radius:3px;
  box-shadow:0 1px 0 var(--accent) inset,0 -2px 0 var(--accent) inset}
.frase.leggo .par{background:var(--accent);color:#fff;border-radius:2px;padding:0 1px}
.senza-voci{font-size:11.5px;color:var(--signal);padding:0 4px}
/* lezione aperta da un rimando esterno: si evidenzia per un attimo, se no
   dopo lo scroll non si capisce quale delle 82 stavi cercando */
.lez.puntata{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:16px;padding:14px}
  .rail{position:static;max-height:none;border-bottom:1px solid var(--line);padding-bottom:12px}
  .cerca{width:150px}
  .brand{font-size:13px}
}
/* ---------- tabella dei progressi ---------- */
.prog{width:100%;border-collapse:collapse;margin-top:15px;font-size:13.5px}
.prog caption{text-align:left;font-family:var(--font-dis);font-weight:600;font-size:14px;
  color:var(--text);padding-bottom:7px}
.prog th,.prog td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--line-2)}
.prog thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--text-3);font-weight:600}
.prog th[scope=row]{text-align:left;font-weight:500;color:var(--text-2);white-space:nowrap}
.prog tfoot th[scope=row],.prog tfoot td{font-weight:700;color:var(--text);
  border-bottom:0;border-top:1px solid var(--line)}
.prog td.p{white-space:nowrap}
.prog .barra{display:inline-block;vertical-align:middle;width:58px;height:6px;margin-right:8px;
  background:var(--line-2);border-radius:3px;overflow:hidden}
.prog .barra i{display:block;height:100%;background:var(--accent);border-radius:3px}
.prog tfoot .barra i{background:var(--good)}
.intro .prog-f{margin-top:9px;font-size:12.5px;color:var(--text-3)}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;
  text-decoration:underline}
@media (max-width:560px){.prog .barra{display:none}}

.sitenav::-webkit-scrollbar{display:none}
.sitenav a,.sitenav button{flex:none;padding:6px 10px;border:0;border-radius:6px;background:none;

<script>
"use strict";
const LEZIONI = [{"o":"Create users and groups","t":"Utenti e gruppi","d":1,"c":"Microsoft Entra ID è la rubrica delle identità: gli **utenti** sono le persone (o i servizi) che accedono, i **gruppi** servono a dare permessi a molti in un colpo solo. Ci sono due tipi di gruppo: **Security**, per assegnare permessi su Azure, e **Microsoft 365**, che oltre ai permessi porta con sé casella condivisa, calendario e Teams.\n\nL'appartenenza può essere **Assigned** (li metti dentro a mano) o **Dynamic** (una regola sugli attributi decide chi entra ed esce da solo).","es":"Vuoi che tutti i commerciali vedano un certo resource group. Invece di 40 assegnazioni, crei un gruppo Security dinamico con la regola `user.department -eq \"Sales\"` e assegni il ruolo **una volta** al gruppo. Quando assumono un commerciale nuovo, entra da solo il giorno che gli compilano il reparto.","tr":"I gruppi dinamici richiedono una licenza **Microsoft Entra ID P1**. E un gruppo dinamico non si popola a mano: se provi ad aggiungere un membro, il portale non te lo lascia fare.","u":"https://learn.microsoft.com/it-it/entra/fundamentals/how-to-manage-groups"},{"o":"Manage user and group properties","t":"Proprietà di utenti e gruppi","d":1,"c":"Ogni utente ha degli attributi: nome, **UPN** (l'indirizzo con cui accede), reparto, qualifica, manager, e la **usage location**. Alcuni sono decorativi, altri fanno funzionare le cose.\n\nDue contano davvero: la **usage location**, senza la quale non puoi assegnare licenze, e gli attributi usati dalle regole dei gruppi dinamici, che se sbagli spostano le persone nel gruppo sbagliato.","es":"Crei un utente, provi ad assegnargli Microsoft 365 E3 e l'assegnazione fallisce senza un motivo chiaro. Manca la usage location: alcuni servizi non sono disponibili ovunque, quindi Entra vuole sapere il paese prima di darti la licenza. La imposti su *Italy* e la licenza va.","tr":"La usage location è la risposta a quasi ogni domanda del tipo «l'assegnazione della licenza fallisce, cosa manca». Manager, job title ed employee ID non bloccano **mai** una licenza.","u":"https://learn.microsoft.com/it-it/entra/fundamentals/how-to-manage-user-profile-info"},{"o":"Manage licenses in Microsoft Entra ID","t":"Licenze","d":1,"c":"Le licenze si assegnano all'utente direttamente oppure — molto meglio — a un **gruppo**: chi entra nel gruppo riceve la licenza, chi esce la perde. Si chiama *group-based licensing*.\n\nOgni licenza contiene più **service plan** che puoi accendere e spegnere singolarmente.","es":"Assegni Microsoft 365 E3 al gruppo *Tutti i dipendenti*. Un neoassunto viene messo nel gruppo dal sistema HR e la mattina dopo ha già la casella. Il giorno che se ne va, esce dal gruppo e la licenza torna disponibile senza che nessuno se ne debba ricordare.","tr":"Se un utente ha la licenza sia diretta sia da gruppo, togliere il gruppo **non** gliela toglie: quella diretta resta. È il motivo per cui le licenze diritte sono difficili da governare.","u":"https://learn.microsoft.com/it-it/entra/identity/users/licensing-groups-assign"},{"o":"Manage external users","t":"Utenti esterni (guest)","d":1,"c":"Un **guest** è una persona di un'altra organizzazione che inviti nel tuo tenant. Entra con le sue credenziali, a casa sua, e nel tuo tenant compare come oggetto utente con `userType = Guest`.\n\nQuanto possono vedere lo decidi con le **guest user access restrictions**, che hanno tre livelli: come i membri, accesso limitato (predefinito), oppure il più restrittivo, in cui il guest vede solo i propri oggetti.","es":"Un consulente esterno deve lavorare su un resource group. Lo inviti come guest, gli assegni **Contributor** solo su quel resource group. Vede quello e nient'altro — e quando il progetto finisce elimini l'oggetto guest, senza aver mai creato una password nel tuo tenant.","tr":"Invitare un guest non gli dà **nessun** accesso ad Azure: l'invito riguarda la directory, i permessi sulle risorse restano una questione di ruoli RBAC da assegnare a parte.","u":"https://learn.microsoft.com/it-it/entra/external-id/what-is-b2b"},{"o":"Configure self-service password reset (SSPR)","t":"Reimpostazione password self-service","d":1,"c":"**SSPR** lascia che gli utenti si reimpostino la password da soli, dimostrando chi sono con metodi alternativi: telefono, email secondaria, domande di sicurezza, app Authenticator.\n\nConfiguri quanti metodi servono (uno o due) e quali sono ammessi. Puoi abilitarlo per tutti o per un gruppo soltanto.","es":"Attivi SSPR per il gruppo *Filiali*, richiedendo due metodi. Un venditore dimentica la password di domenica: va su aka.ms/sspr, riceve un codice sul cellulare, risponde a una domanda e rientra. Nessuno ha dovuto aprire un ticket.","tr":"Con **password writeback** la nuova password torna anche nell'Active Directory locale: senza, in ambiente ibrido l'utente cambia la password cloud e resta fuori dal dominio. Richiede Entra ID P1.","u":"https://learn.microsoft.com/it-it/entra/identity/authentication/tutorial-enable-sspr"},{"o":"Manage built-in Azure roles","t":"Ruoli predefiniti di Azure","d":1,"c":"**Azure RBAC** decide chi può fare cosa sulle risorse. I quattro ruoli fondamentali:\n\n- **Owner** — tutto, compreso dare accesso ad altri\n- **Contributor** — tutto sulle risorse, **ma non** dare accesso\n- **Reader** — solo guardare\n- **User Access Administrator** — solo dare accesso, niente gestione risorse\n\nEsiste poi una distinzione decisiva: **piano di gestione** (la risorsa: crearla, configurarla) contro **piano dati** (il contenuto: leggere un blob, scrivere in una coda). Sono permessi separati.","es":"Dai a un collega **Storage Account Contributor**. Può cambiare la configurazione dello storage account, rigenerare le chiavi, perfino cancellarlo — ma se apre un container non vede un file. Per leggere i blob gli serve **Storage Blob Data Reader**, che è un ruolo *dati*.","tr":"Questa è la domanda più frequente di tutto il dominio. «Contributor sullo storage ma non vede i blob»: normale, servono le **DataActions**. E ricorda che Contributor non può assegnare ruoli — glielo impediscono le sue NotActions.","u":"https://learn.microsoft.com/it-it/azure/role-based-access-control/built-in-roles"},{"o":"Assign roles at different scopes","t":"Ambiti di assegnazione","d":1,"c":"Un ruolo si assegna a un **ambito**, e i permessi scendono verso il basso su quattro livelli:\n\n`management group → subscription → resource group → risorsa`\n\nPiù in alto assegni, più cose copri. I permessi sono **additivi**: se hai Reader sulla subscription e Contributor su un resource group, dentro quel gruppo sei Contributor e altrove sei Reader.","es":"Il team di rete deve gestire le VNet di tutta l'azienda ma non toccare le macchine virtuali. Assegni **Network Contributor** al management group radice: copre ogni subscription, comprese quelle che verranno create l'anno prossimo.","tr":"Un ambito più alto **non** sovrascrive uno più basso, e due ruoli non si annullano mai a vicenda: si sommano. L'unica cosa che sottrae è una *deny assignment*, che però la crea Azure, non tu.","u":"https://learn.microsoft.com/it-it/azure/role-based-access-control/scope-overview"},{"o":"Interpret access assignments","t":"Leggere le assegnazioni di accesso","d":1,"c":"Per capire cosa può fare davvero una persona non basta guardare un'assegnazione: bisogna sommare tutto quello che eredita da ogni livello. Il pannello **Access control (IAM) → Check access** fa esattamente questo conto.\n\nDentro una definizione di ruolo:\n\n- **Actions** — cosa è permesso (piano di gestione)\n- **NotActions** — cosa viene sottratto dalle Actions\n- **DataActions** / **NotDataActions** — lo stesso, sul contenuto","es":"Contributor ha `Actions: *` — sembra poter tutto. Ma le sue NotActions sottraggono `Microsoft.Authorization/*/Write`, ed è precisamente lì che sparisce la facoltà di assegnare ruoli. Il carattere jolly dà tutto, la NotAction toglie il pezzo pericoloso.","tr":"NotActions **non è una negazione**: non blocca un permesso che arriva da un'altra assegnazione. Sottrae solo dalle Actions di quello stesso ruolo. Se un secondo ruolo te lo concede, il permesso ce l'hai.","u":"https://learn.microsoft.com/it-it/azure/role-based-access-control/role-definitions"},{"o":"Implement and manage Azure Policy","t":"Azure Policy","d":1,"c":"RBAC dice **chi** può agire; Azure Policy dice **cosa** è ammesso. Una policy valuta le risorse e applica un **effetto**:\n\n- **Deny** — blocca la creazione\n- **Audit** — lascia fare ma segnala\n- **Modify** — aggiunge o cambia proprietà (es. tag)\n- **DeployIfNotExists** — distribuisce ciò che manca\n\nModify e DeployIfNotExists agiscono sul già esistente solo tramite una **remediation task**, e hanno bisogno di una **managed identity** con i permessi giusti.","es":"Vuoi che nessuno crei risorse fuori dall'Europa. Assegni la policy predefinita *Allowed locations* con effetto Deny e le region consentite. Da quel momento un deployment in East US fallisce prima di partire, con un messaggio che cita la policy.","tr":"Deny agisce **solo** sulle risorse nuove o modificate: quelle che già violano la regola restano lì e compaiono come *non-compliant*. Per sistemarle serve intervenire, non aspettare.","u":"https://learn.microsoft.com/it-it/azure/governance/policy/overview"},{"o":"Configure resource locks","t":"Blocchi sulle risorse","d":1,"c":"Un **lock** protegge dagli errori umani, non dagli utenti malintenzionati. Due tipi:\n\n- **CanNotDelete** — puoi leggere e modificare, non eliminare\n- **ReadOnly** — puoi solo leggere\n\nSi eredita verso il basso: un lock sul resource group protegge tutto ciò che contiene.","es":"Metti CanNotDelete sul resource group di produzione. Un collega lancia per sbaglio l'eliminazione del gruppo: l'operazione fallisce **per intero**, perché Azure non fa eliminazioni parziali. Nessuna risorsa viene persa, nemmeno quelle non bloccate.","tr":"ReadOnly è più insidioso di quanto sembri: può rompere operazioni che sembrano di sola lettura ma che scrivono dietro le quinte, come elencare le chiavi di uno storage account. E chi ha Owner o User Access Administrator può sempre togliere il lock.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/management/lock-resources"},{"o":"Apply and manage tags on resources","t":"Tag","d":1,"c":"I **tag** sono coppie nome-valore che attacchi alle risorse per ritrovarle e per ripartire i costi. Massimo **50 tag** per risorsa.\n\nIl punto che sorprende tutti: **i tag non si ereditano**. Un tag sul resource group non scende sulle risorse dentro.","es":"Metti `CostCenter = 4711` sul resource group e in Cost Management le VM continuano a comparire senza centro di costo. Per farlo scendere davvero assegni la policy predefinita **Inherit a tag from the resource group** (effetto Modify) e lanci una remediation task per le risorse già esistenti.","tr":"«I tag del resource group non compaiono sulle risorse» non è un guasto, è il comportamento previsto. La soluzione è sempre Azure Policy con effetto Modify più remediation task.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/management/tag-resources"},{"o":"Manage resource groups","t":"Resource group","d":1,"c":"Un **resource group** è il contenitore che raggruppa risorse con lo stesso ciclo di vita. Tre regole da tenere a mente:\n\n- una risorsa sta in **un solo** resource group alla volta\n- la **location** del gruppo riguarda solo i suoi metadati: dentro puoi metterci risorse di qualsiasi region\n- eliminare il gruppo **elimina tutto** ciò che contiene","es":"Per un progetto a termine crei `rg-progetto-x` e ci metti dentro VM, dischi, VNet e storage. A fine progetto elimini il resource group: sparisce tutto in un colpo, senza risorse orfane che continuano a costare.","tr":"Spostare risorse fra gruppi **blocca** temporaneamente entrambi i gruppi in scrittura, ma le risorse continuano a funzionare: il blocco riguarda il piano di gestione, non il servizio.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/management/manage-resource-groups-portal"},{"o":"Manage subscriptions","t":"Subscription","d":1,"c":"La **subscription** è insieme un confine di fatturazione e un confine di isolamento: le quote e i limiti si contano lì. Ogni subscription si appoggia a **una sola** directory Entra, mentre una directory può reggerne molte.","es":"Dopo un'acquisizione devi portare la subscription della società comprata nel tuo tenant. Fai il trasferimento di directory — e ti ritrovi che **nessuno** ha più accesso: le assegnazioni di ruolo sono sparite tutte e vanno rifatte per le persone del tenant nuovo.","tr":"Trasferire una subscription in un'altra directory **rimuove tutte le assegnazioni di ruolo Azure**, a ogni ambito. Non vengono rimappate: i principal della vecchia directory semplicemente non esistono più lì.","u":"https://learn.microsoft.com/it-it/azure/role-based-access-control/transfer-subscription"},{"o":"Manage costs by using alerts, budgets, and Azure Advisor recommendations","t":"Costi, budget e Advisor","d":1,"c":"**Cost Management** mostra la spesa, i **budget** ti avvisano prima che diventi un problema, **Azure Advisor** suggerisce dove tagliare.\n\nUn budget può avvisare su due condizioni diverse:\n\n- **Actual** — la spesa ha *già* superato la soglia\n- **Forecasted** — Azure *prevede* che la supererà","es":"Metti un budget di 1.000 € al mese sulla subscription di sviluppo, con un avviso forecasted all'80%. A metà mese Azure calcola che di questo passo arriverai a 1.200 € e ti manda l'email: hai ancora due settimane per spegnere qualcosa.","tr":"Se la domanda dice «avvisami **prima** di sforare», la risposta è **forecasted**. Se dice «quando ho superato», è actual. Advisor invece guarda la telemetria d'uso reale — CPU e rete — per dirti quali VM sono sovradimensionate.","u":"https://learn.microsoft.com/it-it/azure/cost-management-billing/costs/cost-mgt-alerts-monitor-usage-spending"},{"o":"Configure management groups","t":"Management group","d":1,"c":"I **management group** stanno sopra le subscription e servono ad applicare policy e ruoli a tutte insieme. Formano un albero: ogni nodo ha **un solo** genitore, fino a **sei livelli** di profondità oltre alla radice.\n\nIl **management group radice** viene creato da solo per la directory, non si può eliminare, e ogni subscription nuova ci finisce sotto per impostazione predefinita.","es":"Crei due management group, *Produzione* e *Sviluppo*. Su Produzione assegni una policy che vieta le VM di dimensione grande; su Sviluppo no. Ogni subscription che sposti sotto Produzione eredita la regola all'istante, senza doverla riassegnare.","tr":"Se la domanda chiede «una sola assegnazione che copra anche le subscription future», la risposta è **il management group radice**. Assegnare subscription per subscription non copre quelle che non esistono ancora.","u":"https://learn.microsoft.com/it-it/azure/governance/management-groups/overview"},{"o":"Configure Azure Storage firewalls and virtual networks","t":"Firewall dello storage","d":2,"c":"Per impostazione predefinita uno storage account risponde a tutta internet. Il **firewall** lo chiude: porti l'accesso su *reti selezionate* e poi elenchi cosa è ammesso — intervalli IP pubblici, subnet tramite **service endpoint**, o eccezioni per i servizi Azure attendibili.","es":"Solo le VM di una subnet devono accedere. Attivi il service endpoint `Microsoft.Storage` sulla subnet, poi sullo storage porti l'accesso su reti selezionate e aggiungi la **regola di virtual network** per quella subnet. Da fuori, adesso, si prende un 403.","tr":"Il service endpoint da solo **non protegge niente**: cambia l'instradamento e rende la subnet riconoscibile, ma finché non chiudi il firewall e non aggiungi la regola, lo storage continua ad accettare tutti.","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-network-security"},{"o":"Create and use shared access signature (SAS) tokens","t":"Token SAS","d":2,"c":"Un **SAS** è un URL con permessi limitati e una scadenza: lo dai a chi non deve avere le chiavi dell'account. Tre tipi:\n\n- **Account SAS** — più servizi, firmato con la chiave dell'account\n- **Service SAS** — un servizio solo, firmato con la chiave dell'account\n- **User delegation SAS** — firmato con una chiave presa da **Entra ID**, non con la chiave dell'account","es":"Un partner deve caricare file per 48 ore. Usi un **user delegation SAS**: non gli passi niente che derivi dalle chiavi, e per revocarlo ti basta togliere l'assegnazione di ruolo del principal che l'ha firmato.","tr":"**Rigenerare una chiave** invalida di colpo tutti i SAS firmati con quella chiave — un'accetta, non un bisturi. Il user delegation SAS è l'unico che non nasce dalle chiavi dell'account: è la risposta quando la domanda vieta di condividerle.","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-sas-overview"},{"o":"Configure stored access policies","t":"Stored access policy","d":2,"c":"Una **stored access policy** si definisce sul container e conserva permessi e scadenza. Un service SAS che vi si aggancia li **eredita** invece di portarseli scritti dentro.\n\nIl vantaggio è tutto qui: cambi la policy e cambi il SAS; **elimini la policy e il SAS muore**, senza toccare le chiavi.","es":"Hai dato un SAS a un fornitore e vuoi chiuderglielo subito, senza rompere le altre venti applicazioni che usano la stessa chiave. Se il SAS era agganciato a una policy, elimini la policy: revocato solo quello.","tr":"«Revocare un SAS senza toccare le altre credenziali» → **eliminare la stored access policy**. Se il SAS non era agganciato a una policy, l'unica via resta rigenerare la chiave, con tutti i danni collaterali.","u":"https://learn.microsoft.com/it-it/rest/api/storageservices/define-stored-access-policy"},{"o":"Manage access keys","t":"Chiavi di accesso","d":2,"c":"Ogni storage account ha **due chiavi**, key1 e key2, e ognuna dà accesso completo a tutto. Sono due proprio per poterle ruotare senza fermare nulla: sposti le applicazioni su key2, rigeneri key1, e ripeti al giro dopo.\n\nSi può anche **disabilitare del tutto** l'accesso tramite chiave, obbligando all'autenticazione Entra ID.","es":"Imposti una **key expiration policy** di 90 giorni. Passata la scadenza Azure non blocca niente, ma l'account risulta non conforme e la policy di governance te lo segnala: serve a farti ruotare, non a spegnerti il servizio.","tr":"Le chiavi danno accesso **completo**, senza distinzione fra piano dati e gestione e senza scadenza propria: è il motivo per cui la risposta giusta è quasi sempre «usa un SAS o Entra ID, non la chiave».","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-account-keys-manage"},{"o":"Configure identity-based access for Azure Files","t":"Accesso a identità per Azure Files","d":2,"c":"Una share SMB può essere montata con le credenziali di dominio invece che con la chiave. I permessi stanno su **due livelli distinti**:\n\n- **livello share** — chi può montarla: ruoli Azure RBAC (*Storage File Data SMB Share Reader / Contributor / Elevated Contributor*)\n- **livello file e cartella** — le normali **ACL NTFS**, impostate da un client che ha montato la share","es":"Vuoi che il reparto Marketing monti la share e che dentro solo i responsabili scrivano in `\\Budget`. Al gruppo Marketing dai il ruolo *SMB Share Contributor*; sulla cartella Budget metti una ACL NTFS che lascia scrivere ai soli responsabili.","tr":"Azure RBAC **non** si può applicare dentro la share: il permesso su una singola cartella è sempre una ACL NTFS. E l'autenticazione a identità vale per **SMB**, non per NFS.","u":"https://learn.microsoft.com/it-it/azure/storage/files/storage-files-active-directory-overview"},{"o":"Create and configure storage accounts","t":"Storage account","d":2,"c":"Lo **storage account** è il contenitore di primo livello e offre quattro servizi dati: **Blob** (file non strutturati), **File** (share SMB/NFS), **Queue** (messaggi), **Table** (chiave-valore).\n\nAlla creazione scegli cose che poi **non** si cambiano più: il tipo di account, il livello di prestazioni (Standard o Premium) e l'**hierarchical namespace**, cioè l'interruttore che lo trasforma in Data Lake Gen2.","es":"Ti serve storage per un data lake analitico: crei un account **general-purpose v2** e nella scheda Advanced accendi *Hierarchical namespace*. Se te ne dimentichi, non c'è un'impostazione da spuntare dopo: serve un percorso di upgrade separato e a senso unico.","tr":"I managed disk **non** stanno in uno storage account visibile: sono una risorsa a sé. È un distrattore ricorrente nella domanda «quali servizi contiene uno storage account».","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-account-overview"},{"o":"Configure Azure Storage redundancy","t":"Ridondanza","d":2,"c":"La ridondanza dice **quante copie** dei tuoi dati esistono e **dove**:\n\n- **LRS** — 3 copie, un solo datacenter\n- **ZRS** — 3 copie, in 3 zone di disponibilità diverse\n- **GRS** — 3 copie qui + 3 in una region secondaria\n- **GZRS** — ZRS qui + 3 copie nella region secondaria\n\nLe varianti **RA-** (RA-GRS, RA-GZRS) aggiungono la lettura dalla copia secondaria.","es":"Sei su LRS e vuoi arrivare a GZRS. Non si fa in un passaggio: devi passare per due conversioni, per esempio LRS → GRS e poi GRS → GZRS, oppure LRS → ZRS e poi ZRS → GZRS.","tr":"Da LRS a GZRS **non** esiste la conversione diretta. E senza la variante RA-, la copia secondaria c'è ma non la puoi leggere: è lì per il disastro, non per distribuire il carico.","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-redundancy"},{"o":"Configure object replication","t":"Object replication","d":2,"c":"L'**object replication** copia i block blob da un container di origine a uno di destinazione, anche in un altro account o in un'altra region. La copia è **asincrona**: succede poco dopo la scrittura, non nello stesso istante.\n\nRichiede **change feed** e **versioning** attivi sull'origine.","es":"Il sito produce immagini in West Europe e i lettori sono negli Stati Uniti. Con l'object replication le copi in un account in East US e li servi da lì, riducendo la latenza senza cambiare l'applicazione che scrive.","tr":"Non confonderla con la ridondanza: GRS copia **tutto l'account** in modo opaco e a fini di disaster recovery; l'object replication copia **container scelti** e la destinazione è leggibile e scrivibile.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/object-replication-overview"},{"o":"Configure storage account encryption","t":"Cifratura dello storage","d":2,"c":"Tutto ciò che sta in uno storage account è **sempre cifrato a riposo**: non si può spegnere. La sola scelta è chi tiene la chiave:\n\n- **chiavi gestite da Microsoft** — predefinito, non fai nulla\n- **chiavi gestite dal cliente (CMK)** — in un Key Vault tuo, ruoti tu\n\nCon CMK servono *soft delete* e *purge protection* sul vault, e un'identità che possa leggere la chiave.","es":"La conformità impone che la chiave sia sotto il tuo controllo. Metti la chiave in Key Vault, dai allo storage account una managed identity con permesso di lettura sulla chiave, e la colleghi. Il giorno che revochi la chiave, i dati diventano illeggibili — anche per te.","tr":"Non esiste uno storage account non cifrato. Se una domanda chiede «come abiliti la cifratura a riposo», la premessa è falsa: è già attiva, e la vera domanda riguarda **chi possiede la chiave**.","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-service-encryption"},{"o":"Manage data by using Azure Storage Explorer and AzCopy","t":"Storage Explorer e AzCopy","d":2,"c":"**Storage Explorer** è l'interfaccia grafica per sfogliare e spostare dati. **AzCopy** è lo strumento da riga di comando, quello che usi quando i file sono tanti.\n\nDue comandi che non fanno la stessa cosa:\n\n- `azcopy copy` — **aggiunge**, non elimina mai nulla\n- `azcopy sync` — rende la destinazione **identica** all'origine","es":"Devi far combaciare un container con una cartella locale, cancellati compresi:\n\n`azcopy sync 'C:\\dati' 'https://…/mycontainer' --recursive --delete-destination=true`\n\nCon `copy` i file cancellati in locale resterebbero come blob per sempre.","tr":"Se la domanda dice «i blob che in locale non ci sono più devono sparire», è **sync con --delete-destination**. Se dice solo «carica», è copy.","u":"https://learn.microsoft.com/it-it/azure/storage/common/storage-use-azcopy-v10"},{"o":"Create and configure a file share in Azure Files","t":"File share","d":2,"c":"Una **file share** è una condivisione di rete gestita, raggiungibile via **SMB** (Windows, Linux, macOS) o **NFS** (solo su account premium).\n\nDue modelli di fatturazione: **pay-as-you-go** sugli account standard, dove paghi quello che usi, e **provisioned** sui premium, dove decidi tu la dimensione e con essa compri le prestazioni.","es":"Sostituisci un vecchio file server. Crei una share da 500 GiB, la monti con `net use Z: \\\\account.file.core.windows.net\\share` e la agganci al dominio per usare le credenziali aziendali invece della chiave.","tr":"La porta **445** è il collo di bottiglia più frequente: molti provider la bloccano in uscita e la share sembra irraggiungibile. Le share NFS richiedono account premium e non supportano l'autenticazione a identità.","u":"https://learn.microsoft.com/it-it/azure/storage/files/storage-how-to-create-file-share"},{"o":"Create and configure a container in Azure Blob Storage","t":"Container di blob","d":2,"c":"Un **container** raggruppa i blob, come una cartella di primo livello. Il nome deve essere **minuscolo**, da 3 a 63 caratteri, senza due trattini di fila.\n\nIl livello di accesso pubblico ha tre valori: **Private** (niente anonimi), **Blob** (leggono i singoli blob ma non l'elenco), **Container** (leggono anche l'elenco).","es":"Vuoi che le immagini prodotto siano leggibili via URL ma che nessuno possa elencare il container: livello **Blob**. Prima però devi accendere *Allow Blob anonymous access* sull'account, che sui nuovi account nasce spento.","tr":"Container speciali che ricorrono nelle domande: **$web** per il sito statico, **$root** per i blob senza nome di container, **$logs** per i log di servizio.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/anonymous-read-access-configure"},{"o":"Configure storage tiers","t":"Livelli di accesso","d":2,"c":"Il **tier** bilancia il costo di tenere i dati contro quello di leggerli:\n\n- **Hot** — archiviazione cara, accesso economico\n- **Cool** — meno caro tenere, più caro leggere (minimo 30 giorni)\n- **Cold** — ancora più freddo (minimo 90 giorni)\n- **Archive** — costo minimo, ma **offline** (minimo 180 giorni)","es":"Sposti in Archive i backup di tre anni fa. Sei mesi dopo ne serve uno: non lo puoi leggere così com'è. Devi **reidratarlo** portandolo a Hot o Cool, e ci vogliono ore — fino a 15 con priorità standard.","tr":"**Archive è offline**: le letture falliscono finché la reidratazione non finisce, resta disponibile solo il metadato. E se togli un blob dal tier prima del minimo di giorni, paghi comunque la penale di eliminazione anticipata.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/access-tiers-overview"},{"o":"Configure soft delete for blobs and containers","t":"Soft delete","d":2,"c":"Il **soft delete** è il cestino: quello che elimini resta recuperabile per i giorni che imposti. Esiste su due livelli, **blob** e **container**, e vanno accesi separatamente.","es":"Qualcuno cancella un container per sbaglio. Con il soft delete dei container lo ripristini e tornano dentro anche i blob che conteneva — ma solo se nel frattempo nessuno ha creato un container con lo stesso nome, perché il ripristino usa il nome originale.","tr":"Il soft delete dei blob **non** ti fa recuperare i singoli blob dentro un container eliminato: in quel caso l'unità di ripristino è il container. Le due funzionalità sono complementari, non ridondanti.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/soft-delete-blob-overview"},{"o":"Configure snapshots and soft delete for Azure Files","t":"Snapshot e soft delete per Azure Files","d":2,"c":"Uno **snapshot di share** è una copia di sola lettura a un istante preciso, ed è incrementale: paghi solo ciò che è cambiato. Su Windows gli utenti li vedono come *Versioni precedenti* e si recuperano i file da soli.\n\nIl **soft delete** delle share protegge invece dall'eliminazione della share intera.","es":"Programmi uno snapshot notturno. Un utente rovina un documento martedì: clic destro → Versioni precedenti → ripristina quello di lunedì. Nessun ticket, nessun amministratore coinvolto.","tr":"Uno snapshot **non è un backup**: vive nello stesso storage account della share. Se elimini la share, gli snapshot se ne vanno con lei — a meno che non ci sia il soft delete a trattenerla.","u":"https://learn.microsoft.com/it-it/azure/storage/files/storage-snapshots-files"},{"o":"Configure blob lifecycle management","t":"Lifecycle management","d":2,"c":"Una **lifecycle policy** è una regola in JSON che sposta o elimina i blob in base a quanto tempo è passato: dopo N giorni li porti a Cool, dopo M ad Archive, dopo X li elimini. Le regole si filtrano per prefisso o per tag.","es":"Regola su `logs/`: Cool dopo 30 giorni, Archive dopo 90, eliminazione dopo 365. Da quel momento la pulizia si fa da sola e la spesa si ferma da sola.","tr":"Il motore gira **una volta al giorno**, e dopo aver creato o modificato una policy possono servire **fino a 48 ore** perché agisca. Se non è successo niente dopo qualche ora, non è rotta: aspetta.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/lifecycle-management-overview"},{"o":"Configure blob versioning","t":"Versioning dei blob","d":2,"c":"Con il **versioning** ogni scrittura crea una nuova versione: quella nuova diventa corrente, la precedente resta conservata. Ti salva dalle sovrascritture sbagliate, non solo dalle eliminazioni.","es":"Un deployment sbagliato sovrascrive il file di configurazione. Apri il blob, guardi le versioni, promuovi quella di ieri: risolto in trenta secondi.","tr":"Eliminare un blob rimuove **solo la versione corrente**: le precedenti restano e continuano a costare. Un account con versioning e nessuna lifecycle policy cresce senza limite. E il **point-in-time restore** vuole tre cose insieme: versioning, change feed e soft delete.","u":"https://learn.microsoft.com/it-it/azure/storage/blobs/versioning-overview"},{"o":"Interpret an Azure Resource Manager template or a Bicep file","t":"Leggere un template ARM o Bicep","d":3,"c":"Un **template ARM** è un JSON che descrive *cosa vuoi ottenere*, non i passi per ottenerlo. Le sezioni che contano:\n\n- **parameters** — i valori che cambiano a ogni deployment\n- **variables** — valori calcolati una volta e riusati\n- **resources** — le risorse da creare\n- **outputs** — i valori restituiti a fine deployment\n\n**Bicep** è la stessa cosa scritta in modo leggibile: si compila in ARM, non è un motore diverso.","es":"In ARM scrivi `\"name\": \"[concat(parameters('prefisso'), '-vm')]\"`. In Bicep la stessa riga è `name: '${prefisso}-vm'`. Stesso risultato, ma la seconda si legge senza decifrarla.","tr":"`dependsOn` stabilisce **l'ordine**, non crea niente. E in Bicep quasi non serve: se una risorsa riferisce un'altra per simbolo, la dipendenza viene dedotta da sola.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/templates/syntax"},{"o":"Modify an existing Azure Resource Manager template","t":"Modificare un template ARM","d":3,"c":"Le modifiche che ricorrono più spesso:\n\n- **allowedValues** — limita un parametro a un elenco chiuso\n- **defaultValue** — il valore usato se non lo passi\n- **copy** — crea N risorse senza duplicare il blocco\n- **condition** — decide se creare una risorsa o no","es":"Devi creare cinque storage account invece di uno. Non duplichi il blocco: aggiungi `\"copy\": { \"name\": \"loop\", \"count\": 5 }` e costruisci il nome con `copyIndex()`, che a ogni giro ti dà l'indice.","tr":"`copy` è il ciclo, `condition` è un interruttore acceso/spento. Non si sostituiscono. E `minValue`/`maxValue` esistono ma valgono **solo** per i parametri di tipo int.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/templates/copy-resources"},{"o":"Modify an existing Bicep file","t":"Modificare un file Bicep","d":3,"c":"In Bicep le stesse idee hanno una sintassi più corta:\n\n- `@allowed([...])` — decoratore sul parametro\n- `param nome string = 'valore'` — parametro con predefinito\n- `for i in range(0, 5):` — ciclo\n- `if (condizione)` — creazione condizionale\n\nI **module** permettono di riusare pezzi di template come funzioni.","es":"```\n@allowed(['dev', 'test', 'prod'])\nparam ambiente string = 'dev'\n```\nDa qui in poi un deployment che passa `collaudo` fallisce la validazione prima ancora di creare qualcosa.","tr":"Bicep **non** è un servizio a parte: `az deployment` lo compila in ARM e manda quello. Tutto ciò che ARM non sa fare, non lo fa neanche Bicep.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/bicep/file"},{"o":"Deploy resources by using an Azure Resource Manager template or a Bicep file","t":"Distribuire un template","d":3,"c":"Il deployment ha due **modalità**, ed è la distinzione più importante di tutto l'argomento:\n\n- **Incremental** (predefinita) — aggiunge e aggiorna quello che c'è nel template, **lascia stare** il resto\n- **Complete** — quello che non è nel template viene **eliminato**","es":"`New-AzResourceGroupDeployment -Mode Complete` con un template che descrive una sola VM, lanciato su un resource group che ne contiene tre: le altre due spariscono. È il comando che cancella la produzione per sbaglio.","tr":"Se `-Mode` non c'è, la modalità è **Incremental**. Complete va chiesta esplicitamente, e `what-if` è il modo di vedere cosa succederebbe prima di premere.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/templates/deployment-modes"},{"o":"Export a deployment as an Azure Resource Manager template or convert an Azure Resource Manager template to a Bicep file","t":"Esportare e convertire","d":3,"c":"Da una risorsa esistente puoi **esportare** il template, per ripartire da lì invece che da un foglio bianco. Da un template ARM puoi passare a Bicep con `az bicep decompile`, e nella direzione opposta con `az bicep build`.","es":"Hai costruito un ambiente a mano nel portale e lo vuoi ricreare in collaudo. Resource group → *Export template*, poi `az bicep decompile` per ottenere un file leggibile su cui lavorare.","tr":"Il template esportato **non è pronto all'uso**: contiene valori fissi, id di risorse esistenti e a volte proprietà di sola lettura. È un punto di partenza, non un artefatto da rilanciare così com'è.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/templates/export-template-portal"},{"o":"Create a virtual machine","t":"Creare una macchina virtuale","d":3,"c":"Creando una VM dal portale non crei una risorsa sola: nascono insieme il **disco OS**, una **NIC**, un **NSG**, spesso un **IP pubblico**, e la VNet se non c'era. Sono risorse separate, con ciclo di vita proprio.","es":"Elimini una VM che non serve più e il mese dopo la bolletta non cala come previsto: dischi, IP pubblico e NIC sono rimasti lì. Vanno eliminati a parte, o creati fin dall'inizio in un resource group dedicato da buttare tutto insieme.","tr":"Eliminare la VM **non elimina** automaticamente il disco OS né l'IP pubblico. Nelle versioni recenti del portale ci sono delle spunte per farlo, ma non sono il comportamento predefinito storico.","u":"https://learn.microsoft.com/it-it/azure/virtual-machines/windows/quick-create-portal"},{"o":"Configure encryption at host for Azure virtual machines","t":"Encryption at host","d":3,"c":"Con l'**encryption at host** la cifratura avviene sull'host fisico che ospita la VM: vengono cifrati il **disco temporaneo** e le **cache** dei dischi OS e dati, e i dati viaggiano già cifrati fra host e storage.\n\nNon consuma CPU della VM, perché il lavoro non lo fa il sistema guest.\n\nVa **abilitata sulla subscription** prima di poterla usare, e la VM deve avere una dimensione che la supporti.","es":"Il requisito dice: disco temporaneo e cache cifrati, traffico cifrato fra calcolo e storage, e nessun impatto sulla CPU della VM. Quello è encryption at host — la parte «senza consumare CPU» è la firma che lo distingue.","tr":"È **l'unica modifica sostanziale** delle skills measured del 17 aprile 2026: ha sostituito *Configure Azure Disk Encryption*. ADE cifra dentro il sistema guest con BitLocker o dm-crypt e usa CPU della VM; encryption at host no. Se la domanda insiste sul disco temporaneo o sulla CPU, la risposta è encryption at host.","u":"https://learn.microsoft.com/it-it/azure/virtual-machines/disks-enable-host-based-encryption-portal"},{"o":"Move a virtual machine to another resource group, subscription, or region","t":"Spostare una macchina virtuale","d":3,"c":"Tre spostamenti diversi, con meccanismi diversi:\n\n- **altro resource group o subscription** — operazione di *move*, i gruppi coinvolti restano bloccati in scrittura finché non finisce\n- **altra region** — non è un move: si **ricrea** altrove, con Azure Resource Mover o Site Recovery","es":"Sposti una VM cifrata in un'altra subscription e l'operazione fallisce. Il Key Vault con la chiave sta ancora nella subscription vecchia: o sposti anche quello, o disabiliti prima la cifratura.","tr":"Cambiare region **non** è uno spostamento: la risorsa viene ricreata e cambia id. E durante un move i due resource group sono bloccati in scrittura, ma la VM continua a funzionare — il blocco è sul piano di gestione.","u":"https://learn.microsoft.com/it-it/azure/azure-resource-manager/management/move-resource-group-and-subscription"},{"o":"Manage virtual machine sizes","t":"Dimensioni delle VM","d":3,"c":"La **dimensione** (lo SKU) decide CPU, memoria, numero massimo di dischi dati, schede di rete e IOPS. Le famiglie ricorrenti: **B** economiche a crediti, **D** general purpose, **E** tanta memoria, **F** tanta CPU.\n\nRidimensionare richiede un riavvio, e a volte anche di deallocare.","es":"Vuoi passare a una dimensione che nel menu non compare. Il cluster hardware su cui gira la VM non la offre: deallochi la VM, e a quel punto Azure può ricollocarla su un cluster che la supporta.","tr":"«La dimensione che voglio non c'è nell'elenco» → **dealloca la VM**. È la risposta quasi sempre. Se la VM è in un availability set, il vincolo vale per tutto il set.","u":"https://learn.microsoft.com/it-it/azure/virtual-machines/resize-vm"},{"o":"Manage virtual machine disks","t":"Dischi","d":3,"c":"Una VM ha un **disco OS**, zero o più **dischi dati**, e un **disco temporaneo**.\n\nIl temporaneo è la trappola: si chiama `D:` su Windows e `/dev/sdb` su Linux, e il suo contenuto **si perde** a ogni deallocazione o spostamento di host. Non è un disco gestito.\n\nI tipi: **Standard HDD**, **Standard SSD**, **Premium SSD**, **Ultra Disk**.","es":"Un'applicazione scrive i file temporanei su `D:` e dopo una manutenzione della piattaforma non li trova più. Non è un guasto: il disco temporaneo è progettato per essere volatile. I dati che devono sopravvivere vanno su un disco dati.","tr":"Il disco temporaneo **non si ripristina** e non è nel backup. E i dischi si possono espandere ma **non rimpicciolire**: per ridurre devi ricreare.","u":"https://learn.microsoft.com/it-it/azure/virtual-machines/managed-disks-overview"},{"o":"Deploy virtual machines to availability zones and availability sets","t":"Availability set e availability zone","d":3,"c":"Due modi di non perdere tutto insieme:\n\n- **Availability set** — protegge *dentro* un datacenter, distribuendo le VM su **fault domain** (alimentazione e rete separate) e **update domain** (riavvii scaglionati)\n- **Availability zone** — protegge *fra* datacenter: le zone sono edifici distinti nella stessa region","es":"Due web server in un availability set sopravvivono al guasto di un rack e alla manutenzione di Azure. Ma se allaga l'intero datacenter finiscono giù entrambi: per quello servono zone diverse.","tr":"L'availability set si sceglie **alla creazione** e non si aggiunge dopo. Zone e set sono alternativi sulla stessa VM. Lo SLA più alto lo danno le zone.","u":"https://learn.microsoft.com/it-it/azure/virtual-machines/availability"},{"o":"Deploy and configure an Azure Virtual Machine Scale Sets","t":"Virtual Machine Scale Set","d":3,"c":"Uno **scale set** gestisce un gruppo di VM identiche che cresce e cala da solo. Due modalità di orchestrazione:\n\n- **Uniform** — istanze identiche, pensate come un gregge\n- **Flexible** — più simili a VM singole gestite insieme\n\nLe **autoscale rule** decidono quando aggiungere o togliere istanze.","es":"Regola: se la CPU media supera il 70% per 10 minuti, aggiungi un'istanza; se scende sotto il 30%, toglila. Il picco del lunedì mattina si assorbe da solo e la notte si paga il minimo.","tr":"La **modalità di orchestrazione si decide alla creazione e non si cambia più**. Ricorre come distrattore in ogni domanda sugli scale set.","u":"https://learn.microsoft.com/it-it/azure/virtual-machine-scale-sets/overview"},{"o":"Create and manage an Azure Container Registry","t":"Azure Container Registry","d":3,"c":"L'**ACR** è il magazzino privato delle tue immagini container. Tre tier: **Basic**, **Standard**, **Premium** — e la differenza non è solo lo spazio.\n\nSolo **Premium** ha private link, geo-replica e content trust.\n\nL'accesso passa da Entra ID (`az acr login`) o da un **token con scope map** per gli automatismi.","es":"Ti serve un registry raggiungibile solo dalla rete interna, con private endpoint. Basic e Standard non lo offrono: devi essere in **Premium**. È una scelta di tier, non un'impostazione da accendere.","tr":"Private link, geo-replica e content trust = **Premium**. L'admin user è disabilitato per impostazione predefinita e serve solo come ripiego: la via giusta è Entra ID o un token.","u":"https://learn.microsoft.com/it-it/azure/container-registry/container-registry-skus"},{"o":"Provision a container by using Azure Container Instances","t":"Azure Container Instances","d":3,"c":"**ACI** esegue un container senza che tu gestisca nessuna VM: gli dai un'immagine e parte in secondi. Un **container group** raccoglie più container che condividono ciclo di vita, rete e volumi.\n\nLa **restart policy** decide cosa succede quando il processo termina: `Always`, `OnFailure`, `Never`.","es":"Un lavoro notturno di elaborazione: lo lanci in ACI con restart policy `Never`. Gira, finisce, e smetti di pagare. Nessuna VM accesa a vuoto per un'ora di lavoro.","tr":"ACI è per carichi **semplici e isolati**: niente autoscaling, niente bilanciamento. Se la domanda parla di scalare in base al traffico o alla coda, la risposta è Container Apps, non ACI.","u":"https://learn.microsoft.com/it-it/azure/container-instances/container-instances-overview"},{"o":"Provision a container by using Azure Container Apps","t":"Azure Container Apps","d":3,"c":"**Container Apps** sta un gradino sopra ACI: gestisce **revisioni**, ingress, traffico ripartito fra versioni, e scala da solo. La scalabilità è guidata da **KEDA**, che sa reagire a HTTP, code, eventi.\n\nPuò **scalare a zero**: con zero repliche, sul piano Consumption non paghi.","es":"Un worker legge messaggi da una coda Service Bus. Regola di scala personalizzata su Service Bus, repliche minime **0**: la notte la coda è vuota, il worker si spegne, il costo va a zero. All'arrivo dei messaggi riparte.","tr":"«Costo zero quando non c'è lavoro» → **repliche minime a 0** su Container Apps. Con minimo 1 una replica resta accesa e continui a pagare. Una regola HTTP non serve a un worker che ascolta una coda.","u":"https://learn.microsoft.com/it-it/azure/container-apps/scale-app"},{"o":"Manage sizing and scaling for containers, including Azure Container Instances and Azure Container Apps","t":"Dimensionare e scalare i container","d":3,"c":"In **ACI** dichiari CPU e memoria per container, e la somma del gruppo deve stare nei limiti della region. Non c'è scalabilità automatica: se serve più capacità, ne avvii un altro.\n\nIn **Container Apps** dichiari CPU e memoria per replica, e poi **min/max repliche** più le regole di scala.","es":"Stessa applicazione, due mondi. In ACI: 2 vCPU e 4 GB, fisso, e paghi finché gira. In Container Apps: 0,5 vCPU per replica, da 0 a 10 repliche, e la spesa segue il traffico.","tr":"ACI si dimensiona, Container Apps si dimensiona **e** si scala. Se la domanda contiene «automaticamente» o «in base al carico», ACI è escluso in partenza.","u":"https://learn.microsoft.com/it-it/azure/container-instances/container-instances-region-availability"},{"o":"Provision an App Service plan","t":"App Service plan","d":3,"c":"L'**App Service plan** è la capacità di calcolo su cui girano le app: decide tier, dimensione e numero di istanze. Un piano ospita più app, che se ne dividono le risorse.\n\nIl **sistema operativo si sceglie alla creazione** e non si cambia: Windows e Linux non convivono nello stesso piano.","es":"Hai un piano Windows e ti serve un'app che gira da immagine container Linux. Non c'è verso di metterla lì: crei un secondo piano Linux nella stessa region. Due piani, due fatture.","tr":"**Il piano si paga anche senza app sopra.** È fatturato per la capacità che riserva, non per le app in esecuzione: eliminare l'ultima app non ferma la spesa, va eliminato o riportato a Free il piano.","u":"https://learn.microsoft.com/it-it/azure/app-service/overview-hosting-plans"},{"o":"Configure scaling for an App Service plan","t":"Scalare un App Service plan","d":3,"c":"Due direzioni, che si confondono di continuo:\n\n- **Scale up** — cambi il tier: macchine più potenti, e si sbloccano funzionalità legate al tier\n- **Scale out** — aggiungi istanze della stessa dimensione: più capacità di carico\n\nLo scale out può essere manuale o automatico con le autoscale rule.","es":"Il sito regge male il picco di mezzogiorno: **scale out**, da 2 a 5 istanze. Ti servono invece i deployment slot, che il tuo tier non ha: **scale up**, da Basic a Standard. Problemi diversi, leve diverse.","tr":"Se manca una **funzionalità** (slot, backup, dominio personalizzato) serve scale up. Se manca **capacità**, scale out. Lo scale out non sblocca mai nulla.","u":"https://learn.microsoft.com/it-it/azure/app-service/manage-scale-up"},{"o":"Create an App Service","t":"Creare un'App Service","d":3,"c":"Creando un'app scegli: il **piano** (che le dà la region), il **runtime stack** o l'immagine container, e il **nome**, che diventa `<nome>.azurewebsites.net` e quindi deve essere **univoco in tutto Azure**.\n\nDa CLI bastano tre cose: resource group, piano, nome.","es":"`az webapp create --resource-group rg-web --plan plan-prod --name app-contoso-shop`\n\nNon passi la region: l'app la eredita dal piano. È il motivo per cui piano e app stanno sempre nella stessa region.","tr":"Un'app web **non** richiede uno storage account: il file system glielo dà App Service. Lo storage account serve alle **Azure Functions** sul piano Consumption, ed è un distrattore frequente.","u":"https://learn.microsoft.com/it-it/azure/app-service/getting-started"},{"o":"Configure certificates and Transport Layer Security (TLS) for an App Service","t":"Certificati e TLS","d":3,"c":"Per servire HTTPS su un dominio personalizzato servono due cose: un **certificato** e un **binding**.\n\nCertificati: **App Service managed certificate** (gratuito, si rinnova da solo, dal tier Basic in su), **App Service certificate** (a pagamento), oppure un **.pfx** che carichi tu.\n\nBinding: **SNI SSL** gratuito e illimitato, **IP-based SSL** che riserva un IP dedicato e si paga.","es":"Devi mettere HTTPS su `shop.contoso.com` senza spendere e senza rinnovi manuali: managed certificate + binding SNI SSL. Fine.","tr":"Il certificato caricato a mano deve essere un **PFX protetto da password**, con chiave privata da almeno **2048 bit** e i certificati intermedi. E *HTTPS Only* non emette nessun certificato: reindirizza soltanto.","u":"https://learn.microsoft.com/it-it/azure/app-service/configure-ssl-certificate"},{"o":"Map an existing custom DNS name to an App Service","t":"Dominio personalizzato","d":3,"c":"Due record, a seconda di dove attacchi il nome:\n\n- **sottodominio** (`www.contoso.com`) → record **CNAME** verso `<app>.azurewebsites.net`\n- **apex** (`contoso.com`) → record **A** verso l'IP in ingresso, perché un CNAME sull'apex non si può creare\n\nIn più Azure vuole la prova che il dominio è tuo: un record **TXT** chiamato `asuid.<nome>` con il Custom Domain Verification ID.","es":"Per `contoso.com` crei un record A verso l'IP dell'app e un TXT `asuid.contoso.com` con l'ID che trovi nel pannello *Custom domains*. Senza il TXT la convalida non passa, per quanto il record A sia giusto.","tr":"I domini personalizzati **non** sono disponibili sul tier **Free F1**: il minimo è **Shared D1**. E il record di verifica è sempre `asuid.` — `_acme-challenge` è di Let's Encrypt, non di App Service.","u":"https://learn.microsoft.com/it-it/azure/app-service/app-service-web-tutorial-custom-domain"},{"o":"Configure backup for an App Service","t":"Backup di un'App Service","d":3,"c":"Il backup salva contenuto dell'app, configurazione e i **database collegati** (Azure SQL, MySQL, PostgreSQL) in uno storage account tuo. Si può programmare e si può ripristinare sulla stessa app o su un'altra.","es":"Prima di un aggiornamento rischioso fai un backup manuale. L'aggiornamento va male: ripristini, e torni al punto di partenza con contenuto e database allineati.","tr":"Il backup richiede tier **Standard, Premium o Isolated** — su Basic la funzionalità non c'è proprio. Un backup arriva al massimo a **10 GB** fra app e database, e uno storage account protetto da firewall o private endpoint **non** è supportato come destinazione.","u":"https://learn.microsoft.com/it-it/azure/app-service/manage-backup"},{"o":"Configure networking settings for an App Service","t":"Rete di un'App Service","d":3,"c":"Due direzioni da non confondere:\n\n- **in uscita** — *regional VNet integration*: l'app raggiunge indirizzi privati dentro una VNet. La subnet dev'essere vuota e **delegata** a `Microsoft.Web/serverFarms`\n- **in ingresso** — *private endpoint*: l'app riceve un IP privato e sparisce da internet\n\nLe **access restriction** filtrano invece chi può chiamare l'endpoint pubblico.","es":"L'app deve raggiungere un database su IP privato, ma restare pubblica per i clienti. Serve **VNet integration** (uscita). Un private endpoint farebbe l'opposto: chiuderebbe l'ingresso pubblico senza aiutare le chiamate in uscita.","tr":"Integration = **uscita**, private endpoint = **ingresso**. Metà delle domande di rete su App Service si risolve tenendo dritta questa distinzione.","u":"https://learn.microsoft.com/it-it/azure/app-service/overview-vnet-integration"},{"o":"Configure deployment slots for an App Service","t":"Deployment slot","d":3,"c":"Uno **slot** è una copia dell'app con un suo hostname: ci distribuisci la versione nuova, la provi, e poi fai lo **swap** con la produzione. Lo swap scambia il contenuto, non spegne niente.\n\nSlot dal tier **Standard** (5) e **Premium** (20).\n\nAlcune impostazioni **restano allo slot** e non seguono lo scambio.","es":"Distribuisci in *staging*, controlli che l'app risponda, fai swap: la produzione passa alla versione nuova senza downtime. Se qualcosa non va, rifai swap e sei tornato indietro.","tr":"**Non** vengono scambiati: nomi di dominio personalizzati, impostazioni di scalabilità, certificati non pubblici e TLS. Le app setting e le connection string **sì**, a meno che non le spunti come *deployment slot setting*, e allora restano attaccate allo slot.","u":"https://learn.microsoft.com/it-it/azure/app-service/deploy-staging-slots"},{"o":"Create and configure virtual networks and subnets","t":"Virtual network e subnet","d":4,"c":"Una **VNet** è la tua rete privata in Azure: le dai uno spazio di indirizzi CIDR e la dividi in **subnet**. Vive in una region e in una subscription.\n\nIl dettaglio che cambia i conti: Azure **riserva 5 indirizzi** in ogni subnet — il primo (network), tre per gateway e servizi di piattaforma, e l'ultimo (broadcast).","es":"Una subnet `/24` sembra offrire 254 indirizzi utilizzabili. In Azure ne offre **251**. Se ti servono esattamente 254 host, la `/24` non basta.","tr":"Il calcolo «quanti host stanno in questa subnet» ricorre di continuo, e la risposta è sempre 5 in meno di quanto diresti. Una subnet non si può ridurre se contiene già risorse.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/virtual-networks-overview"},{"o":"Create and configure virtual network peering","t":"Peering fra VNet","d":4,"c":"Il **peering** collega due VNet in modo che le risorse si parlino con indirizzi privati, sulla rete di Azure. Fra region diverse si chiama **global peering** e funziona uguale.\n\nLa proprietà che genera più errori: il peering **non è transitivo**.","es":"vnet-a è in peering con vnet-b, e vnet-b con vnet-c. Le VM di vnet-a **non** raggiungono vnet-c: il traffico non attraversa la rete di mezzo. O peeri direttamente a e c, o metti un'appliance in b che instrada.","tr":"Gli spazi di indirizzi **non devono sovrapporsi**, altrimenti il peering non si crea nemmeno. E *Allow forwarded traffic* non rende il peering transitivo: serve quando c'è un'appliance che inoltra.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/virtual-network-peering-overview"},{"o":"Configure public IP addresses","t":"Indirizzi IP pubblici","d":4,"c":"Un **IP pubblico** può essere **Basic** o **Standard**, e **Dynamic** o **Static**.\n\nLo Standard è sempre static, è **chiuso per impostazione predefinita** (senza NSG che consente, non entra niente) e supporta le zone di disponibilità. Il Basic è in via di ritiro.","es":"Assegni un IP pubblico dinamico a una VM e ci punti un record DNS. Deallochi la VM per il fine settimana, la riaccendi, e l'indirizzo è cambiato: il record punta nel vuoto. Con **Static** l'indirizzo resta tuo finché non lo elimini.","tr":"Un IP **dinamico cambia** a ogni deallocazione. Se la domanda parla di DNS, firewall di terzi o whitelist, la risposta è Static.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/ip-services/public-ip-addresses"},{"o":"Configure user-defined routes","t":"User-defined route","d":4,"c":"Azure crea da solo le route di sistema. Una **UDR** le scavalca per mandare il traffico dove vuoi tu — tipicamente dentro un firewall.\n\nQuando più route hanno lo stesso prefisso, vince in quest'ordine:\n\n**UDR → BGP → route di sistema**\n\nPrima però conta sempre il **prefisso più lungo**.","es":"Vuoi che tutto il traffico verso internet passi dal firewall. Crei una UDR `0.0.0.0/0` con next hop *Virtual appliance* e l'IP privato del firewall, e la associ alla subnet.","tr":"L'istinto da networking dice «il dinamico batte lo statico». In Azure è **rovesciato**: la UDR, cioè la scelta amministrativa esplicita, batte il BGP.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/virtual-networks-udr-overview"},{"o":"Troubleshoot network connectivity","t":"Diagnosticare la connettività","d":4,"c":"**Network Watcher** è la cassetta degli attrezzi, e ogni strumento risponde a una domanda diversa:\n\n- **IP flow verify** — questo pacchetto passa? e quale regola decide?\n- **Next hop** — dove finisce il traffico verso questo indirizzo?\n- **Effective routes** — quali route vede davvero questa NIC?\n- **Connection troubleshoot** — una prova singola, adesso\n- **Connection monitor** — sorveglianza continua, con avvisi","es":"Una VM non raggiunge un server. IP flow verify dice *allowed*, quindi non è un NSG. Next hop mostra *Virtual appliance*: c'è una UDR che manda il traffico a un firewall che lo sta scartando. In due passaggi hai isolato il punto.","tr":"Prova **singola** = Connection troubleshoot. Sorveglianza **nel tempo** con avvisi = Connection monitor. È la coppia che l'esame scambia più spesso.","u":"https://learn.microsoft.com/it-it/azure/network-watcher/network-watcher-overview"},{"o":"Create and configure network security groups (NSGs) and application security groups","t":"NSG e ASG","d":4,"c":"Un **NSG** è una lista di regole che consentono o negano traffico. Ogni regola ha una **priorità** da 100 a 4096: si valutano dal numero più basso e **la prima che corrisponde vince**, le altre non vengono nemmeno lette.\n\nUn NSG si associa a una **subnet**, a una **NIC**, o a entrambe.\n\nUn **ASG** è un'etichetta che raggruppa NIC, così scrivi le regole per ruolo invece che per indirizzo.","es":"Invece di elencare gli IP dei web server, crei l'ASG `asg-web`, ci metti dentro le loro NIC, e scrivi una regola sola: da `asg-web` verso `asg-db` sulla porta 1433. Quando aggiungi un server, lo metti nell'ASG e la regola vale già.","tr":"L'NSG è **stateful**: se consenti il traffico in ingresso, la risposta esce senza bisogno di una regola in uscita. È il motivo per cui la risposta a «che regola aggiungo per far tornare indietro il traffico» è spesso **nessuna**.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/network-security-groups-overview"},{"o":"Evaluate effective security rules in NSGs","t":"Regole di sicurezza effettive","d":4,"c":"Con due NSG in gioco, l'ordine di valutazione dipende dalla direzione:\n\n- **in ingresso** — prima la **subnet**, poi la **NIC**\n- **in uscita** — prima la **NIC**, poi la **subnet**\n\nOgni NSG viene valutato per conto suo, e il traffico deve passare **entrambi**. La vista **Effective security rules** sulla NIC unisce tutto e mostra il risultato vero.","es":"La subnet nega il 3389 con priorità 200, la NIC lo consente con priorità 100. Il traffico in ingresso **non passa**: la subnet viene valutata prima e la sua negazione chiude il discorso. La priorità più bassa della NIC non conta, perché la priorità ordina le regole *dentro* un NSG, non fra NSG diversi.","tr":"Guardare un solo NSG porta quasi sempre alla conclusione sbagliata. La vista **Effective security rules** è la risposta a ogni domanda del tipo «quali regole si applicano davvero».","u":"https://learn.microsoft.com/it-it/azure/virtual-network/network-security-group-how-it-works"},{"o":"Implement Azure Bastion","t":"Azure Bastion","d":4,"c":"**Bastion** dà RDP e SSH alle VM **dal browser**, passando dal portale, senza che le macchine abbiano un IP pubblico e senza aprire 3389 o 22 verso internet.\n\nVuole una subnet dedicata chiamata esattamente **AzureBastionSubnet**, di almeno **/26**.","es":"Tre VM senza IP pubblico, NSG che nega tutto dall'esterno. Distribuisci Bastion nella VNet e da quel momento ci entri dal portale in HTTPS: la superficie esposta a internet resta zero.","tr":"Il nome della subnet **non è modificabile**: se non si chiama `AzureBastionSubnet` il deployment fallisce. E la dimensione minima è `/26` — la `/27` che si trova ancora in giro nelle guide vecchie non basta più.","u":"https://learn.microsoft.com/it-it/azure/bastion/bastion-overview"},{"o":"Configure service endpoints for Azure platform as a service (PaaS)","t":"Service endpoint","d":4,"c":"Un **service endpoint** attivato su una subnet fa due cose: manda il traffico verso il servizio PaaS sulla rete di Azure invece che su internet, e fa arrivare al servizio l'**identità della subnet**, così puoi ammetterla nel suo firewall.\n\nIl servizio conserva il suo **IP pubblico**: non riceve un indirizzo privato.","es":"Attivi `Microsoft.Storage` sulla subnet, poi sullo storage account porti il firewall su reti selezionate e aggiungi la regola per quella subnet. Le VM entrano, il resto di internet prende 403.","tr":"Il service endpoint **da solo non protegge nulla**: senza la regola di firewall sul servizio, tutti continuano ad accedere. Sono due passaggi, sempre.","u":"https://learn.microsoft.com/it-it/azure/virtual-network/virtual-network-service-endpoints-overview"},{"o":"Configure private endpoints for Azure PaaS","t":"Private endpoint","d":4,"c":"Un **private endpoint** è una NIC nella tua subnet con un **IP privato** che rappresenta il servizio PaaS. Il servizio entra dentro la tua rete, e ci arrivi anche da on-premises via VPN o ExpressRoute.\n\nPerché il nome pubblico risolva all'IP privato serve una **private DNS zone** — per esempio `privatelink.blob.core.windows.net` — collegata alla VNet.","es":"Metti un private endpoint sullo storage e disabiliti l'accesso pubblico. Ora `stcontoso.blob.core.windows.net` risolve a `10.0.1.4` dall'interno, e da internet non è più raggiungibile in nessun modo.","tr":"Service endpoint = il traffico resta sulla rete Azure ma il servizio tiene l'IP pubblico. Private endpoint = il servizio prende un **IP privato tuo**. Se la domanda nomina on-premises o una DNS zone `privatelink.*`, è private endpoint.","u":"https://learn.microsoft.com/it-it/azure/private-link/private-endpoint-overview"},{"o":"Configure Azure DNS","t":"Azure DNS","d":4,"c":"Due mondi distinti:\n\n- **zona pubblica** — ospita il dominio su internet. Per delegarla davvero devi cambiare i **name server** presso il registrar\n- **zona privata** — risolve nomi dentro le VNet che le colleghi, invisibile da fuori\n\nUna zona privata funziona solo per le VNet collegate con un **virtual network link**; per registrare i nomi delle VM da sola serve la **registrazione automatica**.","es":"Crei la zona pubblica `contoso.com` in Azure e i record ci sono tutti, ma da internet non risolve niente. Manca il passaggio esterno: presso il registrar i name server puntano ancora altrove.","tr":"Una zona privata senza **virtual network link** non risolve nulla, per quanto i record siano corretti. È l'errore più frequente sulle zone private.","u":"https://learn.microsoft.com/it-it/azure/dns/dns-overview"},{"o":"Configure an internal or public load balancer","t":"Load balancer","d":4,"c":"Un **load balancer** lavora al livello 4 (TCP/UDP) e ha quattro pezzi:\n\n- **frontend IP** — dove arriva il traffico, pubblico o privato\n- **backend pool** — le VM che lo ricevono\n- **health probe** — decide chi è sano\n- **rule** — lega frontend, pool e probe su una porta\n\nSKU **Basic** e **Standard**: lo Standard supporta le zone, ha uno SLA, ed è **chiuso per impostazione predefinita**.","es":"Public load balancer davanti a due web server: frontend con IP pubblico, pool con le due VM, probe TCP sulla 80, regola che porta la 80 in ingresso alla 80 del pool. Se una VM cade, la probe la esclude e il traffico va tutto all'altra.","tr":"Un load balancer non fa **niente al livello 7**: se la domanda parla di percorsi URL, cookie o offload TLS, la risposta è **Application Gateway**, non il load balancer.","u":"https://learn.microsoft.com/it-it/azure/load-balancer/load-balancer-overview"},{"o":"Troubleshoot load balancing","t":"Diagnosticare il bilanciamento","d":4,"c":"Quando il traffico non arriva, il colpevole è quasi sempre la **health probe**. Le probe partono dall'indirizzo fisso **168.63.129.16** e viaggiano con il service tag **AzureLoadBalancer**: se un NSG non lo consente sulla porta della probe, ogni istanza risulta non integra e il load balancer trattiene tutto.","es":"Tre VM sane, applicazione avviata su tutte, e zero traffico consegnato. L'NSG non ammette `AzureLoadBalancer` sulla porta della probe: tutte le probe falliscono, tutte le istanze risultano giù.","tr":"Una probe **HTTP considera integro solo il 200**: un 201 o un redirect 302 la fanno fallire. E le VM dietro uno Standard Load Balancer **non hanno accesso a internet in uscita** per impostazione predefinita — il Basic ce l'aveva, ed è il cambiamento che sorprende chi migra.","u":"https://learn.microsoft.com/it-it/azure/load-balancer/load-balancer-troubleshoot-health-probe-status"},{"o":"Interpret metrics in Azure Monitor","t":"Metriche","d":5,"c":"Le **metriche** sono numeri campionati a intervalli regolari: leggere, quasi in tempo reale, conservate **93 giorni**. Rispondono alla domanda «quanto».\n\nOgni metrica ha un'**aggregazione** — media, minimo, massimo, somma, conteggio — e leggere quella sbagliata porta a conclusioni sbagliate.","es":"La CPU media di una VM è al 40% e sembra tutto tranquillo. Guardi il **massimo** e scopri picchi al 100% ogni pochi minuti: la media li stava nascondendo.","tr":"Metriche = numeri, 93 giorni, quasi istantanee. **Log** = record strutturati interrogabili in KQL, con la conservazione che decidi tu. Se la domanda parla di storico lungo o di query, sono i log.","u":"https://learn.microsoft.com/it-it/azure/azure-monitor/essentials/data-platform-metrics"},{"o":"Configure log settings in Azure Monitor","t":"Impostazioni dei log","d":5,"c":"Le risorse non mandano i loro log da nessuna parte finché non glielo dici. Il **diagnostic setting** è l'interruttore: sceglie quali categorie inviare e verso dove.\n\nQuattro destinazioni, con scopi diversi:\n\n- **Log Analytics workspace** — per interrogarli in KQL\n- **Storage account** — per archiviarli a lungo e a poco\n- **Event Hub** — per portarli fuori, verso un SIEM\n- **Partner solution**","es":"Vuoi indagare gli accessi a uno storage account con delle query. Diagnostic setting sull'account, categoria `StorageRead`, destinazione un workspace di Log Analytics. Da lì in avanti li interroghi; **prima** di quel momento non esistono.","tr":"Se la domanda chiede di **interrogare** con KQL, di costruire workbook o di creare log alert, la destinazione è il **Log Analytics workspace** — è l'unica delle quattro che lo permette.","u":"https://learn.microsoft.com/it-it/azure/azure-monitor/essentials/diagnostic-settings"},{"o":"Query and analyze logs in Azure Monitor","t":"Query KQL","d":5,"c":"I log si interrogano in **KQL**. La struttura è sempre la stessa: parti da una tabella e concateni operatori con la pipe.\n\nQuelli che ricorrono: `where` filtra, `project` sceglie le colonne, `summarize` aggrega, `order by` ordina, `take` limita.","es":"```\nHeartbeat\n| where TimeGenerated > ago(1h)\n| summarize count() by Computer\n| order by count_ desc\n```\nQuante volte ogni macchina ha dato segno di vita nell'ultima ora, dalla più attiva.","tr":"`ago(1h)` è il modo idiomatico di dire «ultima ora». E i log arrivano con qualche minuto di ritardo: per una reazione istantanea servono le metriche, non le query.","u":"https://learn.microsoft.com/it-it/azure/azure-monitor/logs/log-query-overview"},{"o":"Set up alert rules, action groups, and alert processing rules in Azure Monitor","t":"Avvisi e action group","d":5,"c":"Un avviso si compone di due pezzi separati, ed è la separazione che confonde:\n\n- la **alert rule** dice *quando* scattare (soglia su metrica, risultato di una query, evento)\n- l'**action group** dice *cosa fare*: email, SMS, webhook, runbook\n\nLe **alert processing rule** applicano trasformazioni trasversali, come sopprimere gli avvisi durante una manutenzione programmata.","es":"Regola: CPU media sopra l'80% per 5 minuti. Action group: email al gruppo operativo e chiamata a un webhook. Senza l'action group l'avviso scatta lo stesso, ma **non lo riceve nessuno**.","tr":"«L'avviso si vede nel portale ma non arriva nessuna email» → manca l'**action group**, o non è collegato. Rilevamento e notifica sono due cose distinte.","u":"https://learn.microsoft.com/it-it/azure/azure-monitor/alerts/alerts-overview"},{"o":"Configure and interpret monitoring of virtual machines, storage accounts, and networks by using Azure Monitor Insights","t":"Insights","d":5,"c":"Gli **Insights** sono viste già pronte sopra metriche e log, una per famiglia di risorse.\n\n**VM insights** aggiunge la funzionalità **Map**: scopre i processi in esecuzione e le connessioni TCP fra di essi, e le disegna. Installa da sé l'Azure Monitor Agent e il Dependency agent.\n\nCi sono anche **Storage insights** e **Network insights**.","es":"Devi capire con chi parla davvero un vecchio server prima di spostarlo. Accendi VM insights con processi e dipendenze: la mappa mostra le connessioni e scopri due dipendenze che nessuno aveva documentato.","tr":"Su Storage insights: se la **E2E latency** sale mentre la **server latency** resta piatta, il ritardo **non è di Azure Storage** — è il client o la rete. È la lettura che l'esame chiede.","u":"https://learn.microsoft.com/it-it/azure/azure-monitor/vm/vminsights-overview"},{"o":"Use Azure Network Watcher and Connection monitor","t":"Network Watcher e Connection monitor","d":5,"c":"**Network Watcher** raccoglie gli strumenti di rete; il **Connection monitor** è quello che sorveglia nel tempo la raggiungibilità e la latenza fra due endpoint, con avvisi.\n\nI **NSG flow log** registrano invece quali flussi sono stati consentiti o negati, e alimentano Traffic Analytics.","es":"Vuoi sapere se il collegamento fra la filiale e l'applicazione peggiora nel corso della giornata. Connection monitor campiona in continuo e ti disegna la curva: il picco delle 14 lo vedi, invece di doverlo indovinare.","tr":"Network Watcher è **regionale** e viene abilitato per region. Prova singola = Connection troubleshoot; sorveglianza continua = **Connection monitor**.","u":"https://learn.microsoft.com/it-it/azure/network-watcher/network-watcher-overview"},{"o":"Create a Recovery Services vault","t":"Recovery Services vault","d":5,"c":"Il **Recovery Services vault** è il contenitore storico dei backup: **macchine virtuali Azure**, **Azure Files**, SQL Server dentro una VM, SAP HANA, e i carichi on-premises tramite l'agente **MARS**.\n\nOspita anche Site Recovery.\n\nLa **ridondanza** si sceglie alla creazione e si può cambiare **solo finché non ci hai messo dentro il primo backup**.","es":"Crei il vault accettando GRS, poi ti accorgi che ti basta LRS e vuoi risparmiare. Se non hai ancora protetto niente, la cambi. Se un backup
