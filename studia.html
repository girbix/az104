c'è già, l'unica strada è un vault nuovo.","tr":"«Cambiare la ridondanza dopo il primo backup» → **non si può**, serve un altro vault. Ed è un dettaglio che cambia risposta a seconda che un backup esista o no: leggi bene la domanda.","u":"https://learn.microsoft.com/it-it/azure/backup/backup-azure-recovery-services-vault-overview"},{"o":"Create an Azure Backup vault","t":"Backup vault","d":5,"c":"Il **Backup vault** è il contenitore più recente, e copre carichi diversi dall'altro: **Azure Disks**, **Azure Blobs**, **Azure Database for PostgreSQL**, Kubernetes.\n\nDue vault distinti, e la sorgente dati decide quale usare.","es":"Devi proteggere blob, dischi e un PostgreSQL flessibile: **Backup vault**. Devi proteggere VM e file share: **Recovery Services vault**. Non sono intercambiabili.","tr":"La domanda ti dà l'elenco delle cose da proteggere e ti chiede il tipo di vault. Impara le due liste: VM e Files stanno di qua, blob e dischi di là.","u":"https://learn.microsoft.com/it-it/azure/backup/backup-vault-overview"},{"o":"Create and configure a backup policy","t":"Backup policy","d":5,"c":"Una **backup policy** dice due cose: **quando** fare il backup e **quanto a lungo** tenerlo. La conservazione è a livelli — giornaliera, settimanale, mensile, annuale — e li combini per ottenere la classica nonno-padre-figlio.","es":"Backup ogni notte alle 2. Tieni 30 giorni di punti giornalieri, 12 settimane di quelli del sabato, 12 mesi di quelli di fine mese. Copri il ripristino recente e l'archivio lungo senza conservare tutto per anni.","tr":"Allungare la conservazione **aumenta lo spazio e quindi il costo**, ma non cambia la frequenza. Sono due manopole indipendenti, e l'esame le mescola apposta.","u":"https://learn.microsoft.com/it-it/azure/backup/backup-azure-vms-first-look-arm"},{"o":"Perform backup and restore operations by using Azure Backup","t":"Backup e ripristino","d":5,"c":"Da un punto di ripristino di una VM puoi:\n\n- **creare una nuova VM**\n- **ripristinare i dischi** e riagganciarli tu\n- **recuperare singoli file**, montando temporaneamente il punto di ripristino come unità\n\nQuest'ultimo è il più usato nella pratica, ed è il più dimenticato all'esame.","es":"Serve un solo file cancellato tre giorni fa. Non ricrei la VM: usi *File recovery*, monti il punto di ripristino, copi il file, smonti. Cinque minuti invece di un'ora.","tr":"Se la domanda dice «un solo file» o «il minimo sforzo», la risposta è il **recupero a livello di file**, non il ripristino della VM intera.","u":"https://learn.microsoft.com/it-it/azure/backup/backup-azure-arm-restore-vms"},{"o":"Configure Azure Site Recovery for Azure resources","t":"Site Recovery","d":5,"c":"**Site Recovery** replica le VM in un'altra region per riaccenderle lì in caso di disastro. Non è un backup: il backup ti riporta indietro nel tempo, Site Recovery ti sposta di luogo.\n\nIl vault va creato nella **region di destinazione**, non insieme alle macchine che protegge.\n\nNella region di origine nasce un **cache storage account** che raccoglie le modifiche prima della replica.","es":"VM in West Europe, replica verso North Europe: il vault sta in **North Europe**. Se allaga West Europe, un vault lì dentro sarebbe irraggiungibile e non potresti orchestrare il failover — che è esattamente il momento in cui ti serve.","tr":"Il vault nella region **di destinazione**: è la risposta contro-intuitiva che l'esame ama. E finché non fai failover nella region di destinazione **non gira nessuna VM**: paghi lo storage replicato, non calcolo duplicato.","u":"https://learn.microsoft.com/it-it/azure/site-recovery/azure-to-azure-tutorial-enable-replication"},{"o":"Perform a failover to a secondary region by using Site Recovery","t":"Failover e failback","d":5,"c":"Tre tipi di failover:\n\n- **test** — prova in una rete isolata, la produzione non si accorge di niente\n- **pianificato** — spegne l'origine per non perdere dati\n- **non pianificato** — per il disastro già avvenuto, l'origine può essere irraggiungibile\n\nDopo il failover la sequenza è: **commit** → **reprotect** (inverte la direzione della replica) → **failover di ritorno**.","es":"Verifica trimestrale: **test failover** in una VNet isolata. La produzione continua a girare, la replica non si ferma, e a fine prova fai la pulizia e non resta niente.","tr":"Esercitazione senza fermi = **test failover**, e in **rete isolata**. Il failover pianificato spegne l'origine, quindi un fermo lo produce. E senza il **reprotect** non puoi tornare indietro.","u":"https://learn.microsoft.com/it-it/azure/site-recovery/azure-to-azure-tutorial-dr-drill"},{"o":"Configure and interpret reports and alerts for backups","t":"Report e avvisi di backup","d":5,"c":"I **Backup Report** si appoggiano a **Log Analytics**: ogni vault ha bisogno di un diagnostic setting che ci spinga dentro i suoi dati. Senza quello, il report è vuoto.\n\nGli **avvisi integrati** di Azure Monitor per i backup scattano da soli sui job falliti — ma per farli arrivare a qualcuno serve una alert processing rule con un action group.","es":"Vuoi il tasso di successo dei backup degli ultimi 90 giorni su tutti i vault. Prima i diagnostic setting verso un workspace, poi il report ha qualcosa da mostrare. Non c'è modo di scorciare: il vault da solo tiene pochi dati recenti.","tr":"I report sono alimentati da una spinta pianificata: sono indietro di **ore**, non di minuti. Per accorgerti subito di un backup fallito serve l'**avviso**, non il report.","u":"https://learn.microsoft.com/it-it/azure/backup/configure-reports"}];

const DOM_IT = {
  1:"Identità e governance", 2:"Storage", 3:"Compute",
  4:"Rete virtuale", 5:"Monitoraggio e manutenzione"
};

/* progressi: quali lezioni hai segnato come studiate e quante volte le hai
   ascoltate, in locale */
const K = "az104:teoria", K_A = "az104:teoria:ascolti", K_V = "az104:teoria:voce";
let fatte = {}, ascolti = {};
try { fatte = JSON.parse(localStorage.getItem(K) || "{}"); } catch(e){ fatte = {}; }
try { ascolti = JSON.parse(localStorage.getItem(K_A) || "{}"); } catch(e){ ascolti = {}; }
const salva = () => { try { localStorage.setItem(K, JSON.stringify(fatte)); } catch(e){} };
const salvaA = () => { try { localStorage.setItem(K_A, JSON.stringify(ascolti)); } catch(e){} };

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

/* Il testo delle lezioni usa un markdown minimo: **grassetto**, `codice`,
   blocchi ```, elenchi con "- ", e righe vuote come separatore di paragrafo.
   Si passa sempre da esc(), quindi il markup non puo' iniettare HTML. */
function rendi(t){
  const blocchi = String(t || "").split(/\n\n+/);
  return blocchi.map(b => {
    b = b.trim();
    if(!b) return "";
    if(b.startsWith("```")){
      return "<pre>" + esc(b.replace(/^```\w*\n?/, "").replace(/```$/, "").trim()) + "</pre>";
    }
    const righe = b.split("\n");
    if(righe.every(r => r.trim().startsWith("- "))){
      return "<ul>" + righe.map(r => "<li>" + inline(r.trim().slice(2)) + "</li>").join("") + "</ul>";
    }
    return "<p>" + righe.map(inline).join("<br>") + "</p>";
  }).join("");
}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, (m,g) => "<code>" + g + "</code>")
    .replace(/\*\*([^*]+)\*\*/g, (m,g) => "<strong>" + g + "</strong>");
}

/* ============================================================ ascolto
   La lettura va a frasi, non tutta d'un fiato: si evidenzia quella in corso,
   e per un limite noto di Chrome un'utterance lunga si interrompe da sola
   dopo una ventina di secondi. Spezzare risolve entrambe le cose. */
const TTS = window.speechSynthesis;
let voci = [], voce = null;
let ora = null;   // { i, frasi, pos, pausa }

/* Le voci di sistema piu' vecchie sono quelle che suonano robotiche. Le si
   riconosce perche' sono locali: le naturali arrivano dalla rete o si
   dichiarano Natural/Neural nel nome. Se ne esiste almeno una naturale, le
   altre non si mostrano nemmeno. */
const naturale = v => !v.localService || /natural|neural|online/i.test(v.name);

function caricaVoci(){
  if(!TTS) return;
  const it = TTS.getVoices().filter(v => /^it\b|^it[-_]/i.test(v.lang));
  const nat = it.filter(naturale);
  voci = nat.length ? nat : it;
  /* Isabella prima, poi le altre naturali in ordine alfabetico. */
  voci.sort((a, b) => {
    const ia = /isabella/i.test(a.name) ? 0 : 1, ib = /isabella/i.test(b.name) ? 0 : 1;
    return ia - ib || a.name.localeCompare(b.name);
  });

  const sel = document.getElementById("voce");
  const salvata = (() => { try { return localStorage.getItem(K_V); } catch(e){ return null; } })();
  sel.innerHTML = "";
  if(!voci.length){
    sel.style.display = "none";
    const av = document.getElementById("no-voci");
    if(av) av.textContent = it.length ? "" : "Nessuna voce italiana installata";
    return;
  }
  sel.style.display = "";
  voci.forEach((v, i) => {
    const o = document.createElement("option");
    o.value = i;
    /* "Microsoft Isabella Online (Natural) - Italian (Italy)" -> "Isabella" */
    o.textContent = v.name.replace(/^Microsoft\s+/i, "")
                          .replace(/\s*(Online|\(Natural\)|Desktop)\s*/gi, " ")
                          .replace(/\s*-\s*Italian.*$/i, "").trim() || v.name;
    sel.appendChild(o);
  });
  const iSalvata = voci.findIndex(v => v.name === salvata);
  sel.selectedIndex = iSalvata >= 0 ? iSalvata : 0;
  voce = voci[sel.selectedIndex];
}

/* Avvolge ogni frase in uno span, cosi' si puo' evidenziare quella in lettura.
   Si salta il contenuto dei blocchi di codice: letto ad alta voce e' rumore. */
function preparaFrasi(root){
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(n.parentElement.closest("pre")) return NodeFilter.FILTER_REJECT;
      if(n.parentElement.closest(".sez h3")) return NodeFilter.FILTER_REJECT;
      return n.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
    }
  });
  const nodi = [];
  while(tw.nextNode()) nodi.push(tw.currentNode);
  nodi.forEach(n => {
    // taglia dopo . ! ? : seguiti da spazio, tenendo la punteggiatura
    const pezzi = n.nodeValue.match(/[^.!?:]+[.!?:]*\s*/g);
    if(!pezzi || pezzi.length === 0) return;
    const frag = document.createDocumentFragment();
    pezzi.forEach(p => {
      if(!p.trim()){ frag.appendChild(document.createTextNode(p)); return; }
      const s = document.createElement("span");
      s.className = "frase";
      s.textContent = p;
      frag.appendChild(s);
    });
    n.parentNode.replaceChild(frag, n);
  });
}

function pulisci(){
  document.querySelectorAll(".frase.leggo").forEach(s => {
    s.classList.remove("leggo");
    if(s.dataset.txt){ s.textContent = s.dataset.txt; delete s.dataset.txt; }
  });
}

function ferma(){
  if(TTS) TTS.cancel();
  ora = null;
  pulisci();
  aggiornaAudio();
}

function avvia(i){
  if(!TTS || !voce) return;
  TTS.cancel();
  pulisci();
  const card = document.getElementById("lez-" + i);
  if(!card) return;
  const frasi = [...card.querySelectorAll(".frase")].filter(s => s.textContent.trim().length > 1);
  if(!frasi.length) return;
  ora = { i, frasi, pos: 0, pausa: false };
  parla();
  aggiornaAudio();
}

function parla(){
  if(!ora || ora.pos >= ora.frasi.length){
    if(ora){
      const l = LEZIONI[ora.i];
      ascolti[l.o] = (ascolti[l.o] || 0) + 1;
      salvaA();
      ora = null;
      pulisci();
      aggiornaAudio();
      disegnaRail();
      disegnaProgresso();
    }
    return;
  }
  const span = ora.frasi[ora.pos];
  const testo = span.textContent;
  const u = new SpeechSynthesisUtterance(testo);
  u.voice = voce;
  u.lang = voce.lang;
  u.rate = 1;

  u.onstart = () => {
    pulisci();
    span.classList.add("leggo");
    span.dataset.txt = testo;
    /* si scorre solo se la frase e' uscita dallo schermo */
    const r = span.getBoundingClientRect();
    if(r.top < 70 || r.bottom > innerHeight - 20)
      span.scrollIntoView({ behavior:"smooth", block:"center" });
  };
  /* Se il motore manda gli eventi di confine, si evidenzia anche la parola.
     Le voci di rete spesso non li mandano: in quel caso resta la frase, che
     e' gia' abbastanza per seguire. */
  u.onboundary = ev => {
    if(ev.name && ev.name !== "word") return;
    const c = ev.charIndex;
    if(typeof c !== "number" || c < 0 || c >= testo.length) return;
    const fine = testo.indexOf(" ", c);
    const par = testo.slice(c, fine < 0 ? testo.length : fine);
    if(!par.trim()) return;
    span.textContent = "";
    span.appendChild(document.createTextNode(testo.slice(0, c)));
    const m = document.createElement("span");
    m.className = "par";
    m.textContent = par;
    span.appendChild(m);
    span.appendChild(document.createTextNode(testo.slice(c + par.length)));
  };
  u.onend = () => {
    if(!ora) return;
    if(span.dataset.txt){ span.textContent = span.dataset.txt; delete span.dataset.txt; }
    span.classList.remove("leggo");
    ora.pos++;
    parla();
  };
  u.onerror = () => { if(ora){ ora.pos++; parla(); } };
  TTS.speak(u);
}

function pausa(){
  if(!ora || !TTS) return;
  if(ora.pausa){ TTS.resume(); ora.pausa = false; }
  else { TTS.pause(); ora.pausa = true; }
  aggiornaAudio();
}

/* Etichetta e stato dei pulsanti, senza ridisegnare la pagina: un redraw
   durante la lettura la interromperebbe. */
function aggiornaAudio(){
  document.querySelectorAll(".audio").forEach(box => {
    const i = +box.dataset.i;
    const l = LEZIONI[i];
    const play = box.querySelector(".play");
    const stop = box.querySelector(".stop");
    const volte = box.querySelector(".volte");
    const attiva = ora && ora.i === i;
    const n = ascolti[l.o] || 0;

    play.classList.toggle("on", !!attiva);
    play.textContent = attiva ? (ora.pausa ? "▶ Riprendi" : "⏸ Pausa")
                              : (n ? "↻ Riascolta" : "▶ Ascolta");
    stop.style.display = attiva ? "" : "none";
    volte.textContent = attiva ? "" : (n === 0 ? "da ascoltare"
                       : n === 1 ? "ascoltato 1 volta" : "ascoltato " + n + " volte");
  });
}

if(TTS){
  caricaVoci();
  TTS.onvoiceschanged = caricaVoci;
  /* Chrome sospende la coda se la scheda va in background. */
  document.addEventListener("visibilitychange", () => { if(document.hidden) ferma(); });
  addEventListener("beforeunload", () => TTS.cancel());
}

let filtro = "";
function visibili(){
  if(!filtro) return LEZIONI;
  const q = filtro.toLowerCase();
  return LEZIONI.filter(l =>
    (l.t + " " + l.o + " " + l.c + " " + l.es + " " + l.tr).toLowerCase().includes(q));
}

function disegnaRail(){
  const lista = visibili();
  const rail = document.getElementById("rail");
  let html = "", domCorrente = null;
  lista.forEach((l, i) => {
    if(l.d !== domCorrente){
      domCorrente = l.d;
      html += '<div class="dom-h">' + esc(DOM_IT[l.d]) + "</div>";
    }
    html += '<button class="nav-l' + (fatte[l.o] ? " fatta" : "") + '" data-i="' + i + '">' +
            esc(l.t) + "</button>";
  });
  rail.innerHTML = html || '<p class="vuoto">Nessun risultato.</p>';
  rail.querySelectorAll(".nav-l").forEach(b => {
    b.onclick = () => {
      const el = document.getElementById("lez-" + b.dataset.i);
      if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    };
  });
}

/* A che punto sei, dominio per dominio.
   Prima era una frase con due numeri dentro ("30 di 82 segnate come studiate"):
   andava riletta ogni volta per capire quanto mancava, e dell'ascolto non
   diceva niente. Si aggiorna sul posto, senza ridisegnare la pagina, perche'
   un redraw mentre una lezione viene letta la interromperebbe. */
function disegnaProgresso(){
  const box = document.getElementById("prog");
  if(!box) return;

  const conta = lez => ({
    n: lez.length,
    studiate: lez.filter(l => fatte[l.o]).length,
    ascoltate: lez.filter(l => ascolti[l.o]).length,
    volte: lez.reduce((s, l) => s + (ascolti[l.o] || 0), 0)
  });
  const righe = [1, 2, 3, 4, 5].map(d => ({
    nome: DOM_IT[d], ...conta(LEZIONI.filter(l => l.d === d))
  }));
  const tot = conta(LEZIONI);

  const perc = r => r.n ? Math.round(r.ascoltate / r.n * 100) : 0;
  const barra = r => '<td class="p"><span class="barra"><i style="width:' + perc(r) +
    '%"></i></span><b>' + perc(r) + "%</b></td>";
  const riga = (r, tag) => "<tr><" + tag + ' scope="row">' + esc(r.nome) + "</" + tag + ">" +
    "<td>" + r.n + "</td><td>" + r.studiate + "</td><td>" + r.ascoltate + "</td>" +
    barra(r) + "</tr>";

  box.innerHTML =
    '<table class="prog"><caption>A che punto sei</caption>' +
    "<thead><tr><th>Dominio</th><th>Lezioni</th><th>Studiate</th><th>Ascoltate</th>" +
    "<th>% ascoltate</th></tr></thead>" +
    "<tbody>" + righe.map(r => riga(r, "th")).join("") + "</tbody>" +
    "<tfoot>" + riga({ nome: "Totale", ...tot }, "th") + "</tfoot></table>" +
    '<p class="prog-f">' +
    (tot.volte ? "In tutto " + tot.volte + (tot.volte === 1 ? " ascolto." : " ascolti.")
               : "Nessuna lezione ascoltata, per ora.") +
    ' <button class="link" type="button" id="azzera-teoria">Azzera studiate e ascolti</button></p>';

  document.getElementById("azzera-teoria").onclick = () => {
    const messaggio = "Azzerare i progressi della teoria?" +
      String.fromCharCode(10, 10) +
      "Si perdono le lezioni segnate come studiate e il conto degli ascolti. " +
      "Le domande non vengono toccate: per quelle c'e' Ricomincia nella barra in alto.";
    if(!confirm(messaggio)) return;
    fatte = {};
    ascolti = {};
    salva();
    salvaA();
    disegna();
  };
}

function disegna(){
  const lista = visibili();
  const main = document.getElementById("main");
  ferma();
  disegnaRail();

  /* lezioni */
  let out = '<div class="intro"><h1>La teoria, in italiano</h1>' +
    "<p>Una lezione per ognuno degli <strong>82 obiettivi</strong> della study guide ufficiale: " +
    "il concetto in due righe, un esempio concreto, e la trappola che l'esame ci costruisce sopra. " +
    "Sono gli stessi obiettivi con cui il simulatore ti dice cosa ripassare, quindi da lì arrivi " +
    "dritto alla lezione giusta. Ognuna si può <strong>ascoltare</strong>: la frase in lettura " +
    "resta evidenziata, e il pulsante mette in pausa.</p>" +
    '<div id="prog"></div></div>';

  if(!lista.length){
    out += '<div class="lez"><p class="vuoto">Nessuna lezione contiene «' + esc(filtro) + '».</p></div>';
  }
  lista.forEach((l, i) => {
    out += '<article class="lez" id="lez-' + i + '">' +
      '<div class="lez-h"><span class="num">' + String(i + 1).padStart(2, "0") + "</span>" +
        "<h2>" + esc(l.t) + "</h2>" +
        '<div class="obj">' + esc(l.o) + "</div></div>" +
      '<div class="lez-b">' +
        '<div class="sez"><h3>Concetto</h3>' + rendi(l.c) + "</div>" +
        '<div class="sez es"><h3>Esempio</h3>' + rendi(l.es) + "</div>" +
        '<div class="sez tr"><h3>All\'esame</h3>' + rendi(l.tr) + "</div>" +
      "</div>" +
      '<div class="lez-f">' +
        '<span class="audio" data-i="' + i + '">' +
          '<button class="btn play" type="button">▶ Ascolta</button>' +
          '<button class="btn stop" type="button" style="display:none" aria-label="Interrompi">■</button>' +
          '<span class="volte"></span>' +
        "</span>" +
        '<a href="' + esc(l.u) + '" target="_blank" rel="noopener noreferrer">↗ Approfondisci su Microsoft Learn</a>' +
        '<button class="btn segna' + (fatte[l.o] ? " on" : "") + '" data-o="' + esc(l.o) + '" data-i="' + i + '">' +
          (fatte[l.o] ? "✓ Studiata" : "Segna studiata") + "</button>" +
      "</div></article>";
  });
  main.innerHTML = out;
  disegnaProgresso();

  /* le frasi vanno avvolte dopo l'inserimento nel DOM, non prima */
  main.querySelectorAll(".lez-b").forEach(preparaFrasi);

  /* Aggiorna sul posto invece di ridisegnare: un redraw durante la lettura
     la interromperebbe, e segnare una lezione mentre l'ascolti e' normale. */
  main.querySelectorAll(".segna").forEach(b => {
    b.onclick = () => {
      const o = b.dataset.o;
      if(fatte[o]) delete fatte[o]; else fatte[o] = 1;
      salva();
      b.classList.toggle("on", !!fatte[o]);
      b.textContent = fatte[o] ? "✓ Studiata" : "Segna studiata";
      disegnaRail();
      disegnaProgresso();
    };
  });

  main.querySelectorAll(".audio").forEach(box => {
    const i = +box.dataset.i;
    box.querySelector(".play").onclick = () => {
      if(!TTS || !voce){
        alert("Il browser non ha voci italiane disponibili per la lettura.");
        return;
      }
      if(ora && ora.i === i) pausa(); else avvia(i);
    };
    box.querySelector(".stop").onclick = ferma;
  });
  aggiornaAudio();
}

document.getElementById("cerca").addEventListener("input", e => {
  filtro = e.target.value.trim();
  disegna();
});
document.getElementById("voce").addEventListener("change", e => {
  ferma();
  voce = voci[+e.target.value] || voci[0];
  if(voce){ try { localStorage.setItem(K_V, voce.name); } catch(err){} }
});
document.getElementById("tema").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  const ora = cur || (sysDark ? "dark" : "light");
  const nuovo = ora === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", nuovo);
  try { localStorage.setItem("az104:tema", nuovo); } catch(e){}
};
try {
  const t = localStorage.getItem("az104:tema");
  if(t) document.documentElement.setAttribute("data-theme", t);
} catch(e){}

disegna();

/* Rimando da un'altra pagina: studia.html?o=<obiettivo ufficiale>.
   Il simulatore lo usa per portare dalla categoria sbagliata alla lezione,
   senza far cercare a mano fra 82 voci. Si aggancia all'obiettivo e non
   all'indice, perche' l'indice cambia appena si filtra. */
(function rimando(){
  const o = new URLSearchParams(location.search).get("o");
  if(!o) return;
  const i = LEZIONI.findIndex(l => l.o === o);
  if(i < 0) return;
  const card = document.getElementById("lez-" + i);
  if(!card) return;
  card.scrollIntoView({ block:"start" });
  card.classList.add("puntata");
  setTimeout(() => card.classList.remove("puntata"), 2600);
})();

/* Ricomincia: le domande tornano tutte come non viste. Il pulsante sta nella
   barra di sito, quindi si trova da qualunque pagina.
   Non tocca la teoria: rifare le domande e' una cosa, dimenticare le lezioni
   un'altra. Per quelle c'e' "Azzera studiate e ascolti" sotto la tabella. */
(function ricomincia(){
  const b = document.getElementById("ricomincia");
  if(!b) return;
  const NL = String.fromCharCode(10);
  b.addEventListener("click", () => {
    if(!confirm(
      "Ricominciare le domande da zero?" + NL + NL +
      "Si azzerano: le risposte date, gli esiti, gli esami sostenuti e i segni" + NL +
      "« la sapevo / da rivedere » del ripasso." + NL + NL +
      "Restano: le tue note, le correzioni che hai salvato, e tutta la teoria." + NL + NL +
      "Non si torna indietro."
    )) return;
    try{
      const raw = localStorage.getItem("az104:user");
      if(raw){
        const u = JSON.parse(raw);
        u.prog = {};
        u.history = [];
        localStorage.setItem("az104:user", JSON.stringify(u));
      }
      localStorage.removeItem("az104-ripasso-v1");
    }catch(e){ /* browser senza memoria locale: non c'e' niente da azzerare */ }
    /* La pagina aperta puo' avere gli stessi dati gia' in memoria: senza questo,
       il primo salvataggio dopo il click li riscriverebbe come stavano. */
    if(typeof window.azzeraInMemoria === "function") window.azzeraInMemoria();
    location.reload();
  });
})();
</script>
